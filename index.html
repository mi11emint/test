<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLEACH風 ポエムジェネレーター</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121214',
                        cardBg: '#1e1e24',
                        accentRed: '#e50914'
                    },
                    fontFamily: {
                        serif: ['"Shippori Mincho"', '"Noto Serif JP"', 'serif'],
                        sans: ['"Inter"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts for BLEACH-like typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        /* 縦書きモード指定 */
        .writing-vertical {
            writing-mode: vertical-rl;
            text-orientation: upright;
        }
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 3px;
        }
        /* ポエムカードのスマホフィット */
        .poem-card-container {
            width: 100%;
            max-width: 380px;
            aspect-ratio: 1 / 1.5;
        }
    </style>
</head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen flex flex-col antialiased selection:bg-rose-500 selection:text-white pb-8">

    <!-- Header Area -->
    <header class="border-b border-zinc-800 bg-zinc-950/90 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-3 py-2 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="bg-accentRed text-white text-[10px] sm:text-xs font-bold px-2 py-0.5 rounded tracking-wider">POEM</span>
                <h1 class="text-base sm:text-lg font-bold tracking-wider text-white flex items-center gap-1.5">
                    BLEACH <span class="text-[10px] sm:text-xs font-normal text-zinc-400">ジェネレーター</span>
                </h1>
            </div>

            <!-- 背景色切り替えトグル (ポエムカード出力用) -->
            <div class="bg-zinc-900 border border-zinc-700/80 p-0.5 rounded-lg flex items-center gap-1 shadow-inner">
                <button id="btnBgDark" onclick="setPreviewBg('dark')" class="px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 bg-zinc-700 text-white shadow-sm min-h-[32px]">
                    <span class="w-2 h-2 rounded-full bg-black border border-zinc-500 inline-block"></span> 黒
                </button>
                <button id="btnBgLight" onclick="setPreviewBg('light')" class="px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 text-zinc-400 hover:text-white min-h-[32px]">
                    <span class="w-2 h-2 rounded-full bg-white inline-block"></span> 白
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-3 pt-2 flex-1 w-full flex flex-col gap-4">

        <!-- プレビュー画面 -->
        <section class="w-full flex flex-col items-center gap-2 border-b border-zinc-800/80 pb-4 pt-1">
            <div class="w-full flex items-center justify-between px-1">
                <div class="flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-accentRed" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                    <h2 class="text-xs sm:text-sm font-bold text-white tracking-wide">リアルタイムプレビュー <span class="text-[10px] text-zinc-400 font-normal ml-1">(長押し/右クリックで画像保存可能)</span></h2>
                </div>
                <button onclick="downloadImage()" class="bg-accentRed hover:bg-rose-600 active:scale-95 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition shadow-lg shadow-rose-950/50 flex items-center gap-1.5 min-h-[36px]">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    保存 (JPEG)
                </button>
            </div>

            <!-- BLEACH巻頭風ポエムカード本体 (プレビュー) -->
            <div class="w-full flex justify-center py-1">
                <div id="poemCard" class="poem-card-container bg-black text-white p-4 sm:p-5 transition-colors duration-300 shadow-2xl rounded-sm flex flex-col justify-between border border-zinc-800 relative select-none overflow-hidden">
                    
                    <!-- 横長モノクロ画像表示枠 -->
                    <div id="imageDisplayBox" onclick="onDisplayBoxClick()" class="w-full h-14 sm:h-16 bg-zinc-900 relative overflow-hidden flex items-center justify-center border border-zinc-800/50 cursor-pointer hover:border-accentRed transition z-0">
                        <img id="previewImg" src="" alt="ポエム用画像" class="absolute max-w-none w-full hidden object-cover filter grayscale pointer-events-none">
                        <div id="imgPlaceholder" class="text-zinc-600 text-[11px] text-center px-2">
                            [ クリックして画像を編集・トリミング ]
                        </div>
                    </div>

                    <!-- 縦書きポエムテキスト領域 -->
                    <div class="my-2 flex-1 flex justify-center items-start min-h-[180px] py-1 z-0">
                        <div id="previewPoem" class="writing-vertical font-serif text-base sm:text-lg tracking-[0.2em] leading-[2em] max-h-[260px] flex flex-row-reverse flex-wrap items-start whitespace-pre-wrap">
                        </div>
                    </div>

                    <!-- 巻数＆詩タイトル枠 -->
                    <div class="pt-1 flex justify-center items-center z-0">
                        <div id="previewTitleBorder" class="border-[3px] border-white px-2.5 py-1.5 flex items-center gap-2 font-extrabold tracking-wider max-w-[260px] sm:max-w-[290px] min-h-[50px]">
                            <span id="previewVolNum" class="text-base sm:text-lg font-black leading-none shrink-0">1.</span>
                            <span id="previewVolTitle" class="text-[11px] sm:text-xs font-extrabold uppercase tracking-widest leading-tight break-words uppercase">THE DEATH AND THE STRAWBERRY</span>
                        </div>
                    </div>

                    <!-- 長押し / 右クリック保存用 透明オーバーレイ画像 -->
                    <img id="longPressOverlay" alt="Bleach Poem Preview Image" class="absolute inset-0 w-full h-full opacity-0 z-10 cursor-pointer" title="長押しまたは右クリックで画像を保存">
                </div>
            </div>
        </section>

        <!-- 下部：コンパクト3カラムデザイン・テキスト編集パネル -->
        <section class="w-full grid grid-cols-1 md:grid-cols-3 gap-3">
            
            <!-- 1. 横長画像設定 -->
            <div class="bg-cardBg/90 border border-zinc-800 rounded-xl p-3 shadow-lg flex flex-col justify-between gap-2">
                <h3 class="text-xs font-semibold text-zinc-300 flex items-center justify-between">
                    <span>1. 画像設定 <span class="text-[10px] text-zinc-500 font-normal">(自動モノクロ)</span></span>
                </h3>

                <!-- アップロードエリア -->
                <div id="dropZone" onclick="document.getElementById('imageInput').click()" 
                     class="border-2 border-dashed border-zinc-700 hover:border-accentRed/70 bg-zinc-900/50 hover:bg-zinc-900 transition cursor-pointer rounded-lg p-2 text-center group flex flex-col items-center justify-center min-h-[70px]">
                    <svg class="w-5 h-5 text-zinc-500 group-hover:text-accentRed transition mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p class="text-[11px] text-zinc-400 group-hover:text-zinc-200 font-medium">タップして画像を選択</p>
                    <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                </div>

                <div id="editTriggerBtn" class="hidden">
                    <button onclick="openCropModal()" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-semibold py-1.5 rounded-lg transition border border-zinc-700 flex items-center justify-center gap-1">
                        <svg class="w-3.5 h-3.5 text-accentRed" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                        </svg>
                        位置・トリミング調整
                    </button>
                </div>
            </div>

            <!-- 2. 詩 (ポエム) 本文 -->
            <div class="bg-cardBg/90 border border-zinc-800 rounded-xl p-3 shadow-lg flex flex-col justify-between gap-1.5">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-semibold text-zinc-300">2. 詩 (ポエム) 本文</h3>
                    <button onclick="applySamplePoem()" class="text-[11px] text-accentRed hover:text-rose-400 underline transition py-0.5">
                        サンプル適用
                    </button>
                </div>
                <textarea id="poemInput" rows="3" placeholder="ここに詩を入力（改行で縦列が変わります）"
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-accentRed transition leading-relaxed resize-none"
                    oninput="updateControls()"></textarea>
            </div>

            <!-- 3. 巻数＆タイトル（自動折り返し） -->
            <div class="bg-cardBg/90 border border-zinc-800 rounded-xl p-3 shadow-lg flex flex-col justify-between gap-1.5">
                <h3 class="text-xs font-semibold text-zinc-300">3. 巻数＆タイトル <span class="text-[10px] text-zinc-500 font-normal">(自動折り返し)</span></h3>
                <div class="space-y-1.5">
                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-0.5">巻数数字</label>
                        <input type="text" id="volNumInput" value="1." placeholder="例: 1."
                            class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-2.5 py-1 text-xs text-zinc-100 focus:outline-none focus:border-accentRed min-h-[34px]"
                            oninput="updateControls()">
                    </div>
                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-0.5">詩タイトル</label>
                        <input type="text" id="volTitleInput" value="THE DEATH AND THE STRAWBERRY" placeholder="例: THE DEATH AND..."
                            class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-2.5 py-1 text-xs text-zinc-100 focus:outline-none focus:border-accentRed min-h-[34px]"
                            oninput="updateControls()">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 画像トリミング・調整モーダル (画面上に重ねる方式) -->
    <div id="cropModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-3">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl w-full max-w-lg overflow-hidden flex flex-col shadow-2xl">
            <!-- Modal Header -->
            <div class="px-4 py-2.5 border-b border-zinc-800 flex items-center justify-between bg-zinc-950/50">
                <h3 class="text-xs font-bold text-white flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-accentRed inline-block"></span>
                    画像の切り抜き・位置調整
                </h3>
                <button onclick="closeCropModal()" class="text-zinc-400 hover:text-white transition p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- Modal Body: Interactive Editing Area -->
            <div class="p-4 flex flex-col items-center gap-3">
                <p class="text-xs text-zinc-400 text-center">
                    画像をドラッグして移動 / ホイール・ピンチで拡大縮小できます
                </p>

                <!-- プレビューと同一比率の編集ビューポート -->
                <div id="cropViewport" class="w-full h-24 sm:h-28 bg-black relative overflow-hidden rounded-lg border-2 border-accentRed/70 cursor-grab active:cursor-grabbing touch-none flex items-center justify-center shadow-inner">
                    <canvas id="cropCanvas" class="absolute pointer-events-none"></canvas>
                    <div class="absolute inset-0 border border-white/20 pointer-events-none flex items-center justify-center">
                        <span class="text-[10px] text-white/40 font-mono tracking-widest uppercase">CROP AREA</span>
                    </div>
                </div>

                <!-- 簡易操作ボタン群 -->
                <div class="w-full flex items-center justify-between gap-2 pt-1">
                    <div class="flex items-center gap-1">
                        <span class="text-[11px] text-zinc-400 mr-1">ズーム:</span>
                        <button onclick="adjustCropZoom(-0.1)" class="w-8 h-8 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-white font-bold flex items-center justify-center text-sm active:scale-95 transition border border-zinc-700">-</button>
                        <button onclick="adjustCropZoom(0.1)" class="w-8 h-8 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-white font-bold flex items-center justify-center text-sm active:scale-95 transition border border-zinc-700">+</button>
                    </div>

                    <div class="flex items-center gap-1">
                        <span class="text-[11px] text-zinc-400 mr-1">コントラスト:</span>
                        <button onclick="adjustCropContrast(-10)" class="w-8 h-8 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-white font-bold flex items-center justify-center text-sm active:scale-95 transition border border-zinc-700">-</button>
                        <button onclick="adjustCropContrast(10)" class="w-8 h-8 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-white font-bold flex items-center justify-center text-sm active:scale-95 transition border border-zinc-700">+</button>
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="px-4 py-2.5 border-t border-zinc-800 bg-zinc-950/50 flex justify-end gap-2">
                <button onclick="closeCropModal()" class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-zinc-400 hover:text-white transition">
                    キャンセル
                </button>
                <button onclick="applyCrop()" class="px-4 py-1.5 rounded-xl text-xs font-bold bg-accentRed hover:bg-rose-600 text-white transition active:scale-95 shadow-md shadow-rose-950/50">
                    決定・反映
                </button>
            </div>
        </div>
    </div>

    <!-- Canvas (非表示エクスポート用) -->
    <canvas id="exportCanvas" class="hidden"></canvas>

    <!-- App Script Logic -->
    <script>
        // State Variables
        let currentTheme = 'dark'; // 'dark' | 'light'
        let sourceImage = null;    // 原本Imageオブジェクト
        
        // トリミング／クロップ状態パラメータ
        let cropState = {
            x: 0,
            y: 0,
            scale: 1,
            contrast: 130
        };

        // タッチ・ドラッグ用変数
        let isDragging = false;
        let startX = 0, startY = 0;
        let lastPinchDist = null;

        // Default Sample Poem
        const defaultPoem = "僕たちは 伸ばす手に\n駆ける髪に\n背中に届く まぶしい光に\n似た何かを夢見ている";

        // DOM Elements
        const poemInput = document.getElementById('poemInput');
        const volNumInput = document.getElementById('volNumInput');
        const volTitleInput = document.getElementById('volTitleInput');
        
        const previewPoem = document.getElementById('previewPoem');
        const previewVolNum = document.getElementById('previewVolNum');
        const previewVolTitle = document.getElementById('previewVolTitle');
        const previewImg = document.getElementById('previewImg');
        const imgPlaceholder = document.getElementById('imgPlaceholder');
        const poemCard = document.getElementById('poemCard');
        const previewTitleBorder = document.getElementById('previewTitleBorder');
        const cropViewport = document.getElementById('cropViewport');
        const cropCanvas = document.getElementById('cropCanvas');
        const longPressOverlay = document.getElementById('longPressOverlay');

        // Initialize App
        window.onload = () => {
            poemInput.value = defaultPoem;
            updateControls();
            setupInteractiveCrop();

            // Drag and drop setup
            const dropZone = document.getElementById('dropZone');
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('border-accentRed');
            });
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('border-accentRed');
            });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('border-accentRed');
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    loadImageFile(e.dataTransfer.files[0]);
                }
            });
        };

        // 画像枠タップ時の挙動
        function onDisplayBoxClick() {
            if (sourceImage) {
                openCropModal();
            } else {
                document.getElementById('imageInput').click();
            }
        }

        // 画像選択時のコールバック
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                loadImageFile(file);
            }
        }

        function loadImageFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    sourceImage = img;
                    // クロップ初期位置の調整（アスペクト比に基づき中央配置）
                    const vpW = cropViewport.clientWidth || 300;
                    const vpH = cropViewport.clientHeight || 70;
                    
                    const scaleW = vpW / img.width;
                    const scaleH = vpH / img.height;
                    cropState.scale = Math.max(scaleW, scaleH);
                    
                    cropState.x = (vpW - img.width * cropState.scale) / 2;
                    cropState.y = (vpH - img.height * cropState.scale) / 2;
                    cropState.contrast = 130;

                    document.getElementById('editTriggerBtn').classList.remove('hidden');
                    openCropModal();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // トリミングモーダルの開閉
        function openCropModal() {
            if (!sourceImage) return;
            const modal = document.getElementById('cropModal');
            modal.classList.remove('hidden');
            setTimeout(() => {
                renderCropCanvas();
            }, 50);
        }

        function closeCropModal() {
            document.getElementById('cropModal').classList.add('hidden');
        }

        // モーダル用キャンバスのリアルタイム描画
        function renderCropCanvas() {
            if (!sourceImage) return;
            const vpW = cropViewport.clientWidth;
            const vpH = cropViewport.clientHeight;

            cropCanvas.width = vpW;
            cropCanvas.height = vpH;

            const ctx = cropCanvas.getContext('2d');
            ctx.clearRect(0, 0, vpW, vpH);

            ctx.save();
            ctx.filter = `grayscale(100%) contrast(${cropState.contrast}%)`;
            ctx.drawImage(
                sourceImage, 
                cropState.x, 
                cropState.y, 
                sourceImage.width * cropState.scale, 
                sourceImage.height * cropState.scale
            );
            ctx.restore();
        }

        // 直感操作（ドラッグ・ホイール・ピンチ）のリスナー設定
        function setupInteractiveCrop() {
            // Drag Mouse/Touch
            const startDrag = (clientX, clientY) => {
                isDragging = true;
                startX = clientX - cropState.x;
                startY = clientY - cropState.y;
            };

            const moveDrag = (clientX, clientY) => {
                if (!isDragging) return;
                cropState.x = clientX - startX;
                cropState.y = clientY - startY;
                renderCropCanvas();
            };

            const stopDrag = () => {
                isDragging = false;
            };

            cropViewport.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
            window.addEventListener('mouseup', stopDrag);

            cropViewport.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    startDrag(e.touches[0].clientX, e.touches[0].clientY);
                } else if (e.touches.length === 2) {
                    isDragging = false;
                    lastPinchDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length === 1) {
                    moveDrag(e.touches[0].clientX, e.touches[0].clientY);
                } else if (e.touches.length === 2 && lastPinchDist) {
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    const factor = dist / lastPinchDist;
                    adjustCropZoom((factor - 1) * 0.5);
                    lastPinchDist = dist;
                }
            }, { passive: true });

            window.addEventListener('touchend', () => {
                stopDrag();
                lastPinchDist = null;
            });

            // Wheel Zoom
            cropViewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY < 0 ? 0.05 : -0.05;
                adjustCropZoom(delta);
            }, { passive: false });
        }

        // ズーム・コントラスト微調整関数
        function adjustCropZoom(delta) {
            const vpW = cropViewport.clientWidth;
            const vpH = cropViewport.clientHeight;
            const oldScale = cropState.scale;
            let newScale = oldScale + delta;
            
            // 最小縮小制限
            const minScale = Math.max(vpW / sourceImage.width, vpH / sourceImage.height) * 0.5;
            newScale = Math.max(minScale, Math.min(newScale, 5.0));

            // 中心基準で拡大縮小
            const centerX = vpW / 2;
            const centerY = vpH / 2;
            
            cropState.x = centerX - (centerX - cropState.x) * (newScale / oldScale);
            cropState.y = centerY - (centerY - cropState.y) * (newScale / oldScale);
            cropState.scale = newScale;

            renderCropCanvas();
        }

        function adjustCropContrast(delta) {
            cropState.contrast = Math.max(30, Math.min(300, cropState.contrast + delta));
            renderCropCanvas();
        }

        // クロップ結果の確定とプレビューへの反映
        function applyCrop() {
            if (!sourceImage) return;

            // クロップした枠のイメージデータURLを作成
            const tempCanvas = document.createElement('canvas');
            const vpW = cropViewport.clientWidth || 300;
            const vpH = cropViewport.clientHeight || 70;
            
            tempCanvas.width = vpW * 2; // 高解像度化
            tempCanvas.height = vpH * 2;

            const ctx = tempCanvas.getContext('2d');
            ctx.scale(2, 2);
            ctx.filter = `grayscale(100%) contrast(${cropState.contrast}%)`;
            ctx.drawImage(
                sourceImage, 
                cropState.x, 
                cropState.y, 
                sourceImage.width * cropState.scale, 
                sourceImage.height * cropState.scale
            );

            previewImg.src = tempCanvas.toDataURL('image/png');
            previewImg.classList.remove('hidden');
            imgPlaceholder.classList.add('hidden');

            closeCropModal();
            updateControls();
        }

        // サンプルポエムの適用
        function applySamplePoem() {
            poemInput.value = defaultPoem;
            volNumInput.value = "1.";
            volTitleInput.value = "THE DEATH AND THE STRAWBERRY";
            updateControls();
        }

        // プレビューテーマ（黒/白）の切り替え
        function setPreviewBg(mode) {
            currentTheme = mode;
            const btnDark = document.getElementById('btnBgDark');
            const btnLight = document.getElementById('btnBgLight');

            if (mode === 'dark') {
                poemCard.style.backgroundColor = '#000000';
                poemCard.style.color = '#ffffff';
                previewTitleBorder.style.borderColor = '#ffffff';

                btnDark.className = "px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 bg-zinc-700 text-white shadow-sm min-h-[32px]";
                btnLight.className = "px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 text-zinc-400 hover:text-white min-h-[32px]";
            } else {
                poemCard.style.backgroundColor = '#ffffff';
                poemCard.style.color = '#000000';
                previewTitleBorder.style.borderColor = '#000000';

                btnLight.className = "px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 bg-zinc-200 text-zinc-900 font-bold shadow-sm min-h-[32px]";
                btnDark.className = "px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 text-zinc-400 hover:text-white min-h-[32px]";
            }
            updateControls();
        }

        // リアルタイムテキスト更新 & 長押し保存用画像の更新
        function updateControls() {
            previewPoem.innerText = poemInput.value || " ";
            previewVolNum.innerText = volNumInput.value || "";
            previewVolTitle.innerText = volTitleInput.value || "";

            // 長押し保存用の透過オーバーレイ画像の生成
            generateOverlayImage();
        }

        // Canvas描画関数（共通）
        function generateCanvas() {
            const canvas = document.getElementById('exportCanvas');
            const ctx = canvas.getContext('2d');

            // 800x1200 の高画質キャンバス
            const width = 800;
            const height = 1200;
            canvas.width = width;
            canvas.height = height;

            const isDark = currentTheme === 'dark';
            const bgColor = isDark ? '#000000' : '#ffffff';
            const textColor = isDark ? '#ffffff' : '#000000';

            // 1. 背景色の塗りつぶし
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, width, height);

            // 2. 上部画像のレンダリング
            const imgBoxX = 60;
            const imgBoxY = 60;
            const imgBoxWidth = width - 120;
            const imgBoxHeight = 140;

            if (sourceImage) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(imgBoxX, imgBoxY, imgBoxWidth, imgBoxHeight);
                ctx.clip();

                ctx.filter = `grayscale(100%) contrast(${cropState.contrast}%)`;

                // 編集枠の比率をエクスポート用キャンバスにスケール展開
                const vpW = cropViewport.clientWidth || 300;
                const scaleRatio = imgBoxWidth / vpW;

                const drawX = imgBoxX + cropState.x * scaleRatio;
                const drawY = imgBoxY + cropState.y * scaleRatio;
                const drawW = sourceImage.width * cropState.scale * scaleRatio;
                const drawH = sourceImage.height * cropState.scale * scaleRatio;

                ctx.drawImage(sourceImage, drawX, drawY, drawW, drawH);
                ctx.restore();
            } else {
                ctx.strokeStyle = isDark ? '#333333' : '#cccccc';
                ctx.lineWidth = 2;
                ctx.strokeRect(imgBoxX, imgBoxY, imgBoxWidth, imgBoxHeight);
            }

            // 3. 縦書きポエムテキストの精密描画（左右中央寄せ計算）
            ctx.fillStyle = textColor;
            ctx.font = '700 34px "Shippori Mincho", "Noto Serif JP", serif';
            ctx.textBaseline = 'top';

            const lines = poemInput.value.split('\n');
            const lineSpacing = 65;
            const startY = 260;

            // 全体のポエム列幅を計算してCanvasの中央に配置
            const totalPoemWidth = (lines.length - 1) * lineSpacing;
            const startX = (width + totalPoemWidth) / 2;

            lines.forEach((line, lineIndex) => {
                const currentX = startX - (lineIndex * lineSpacing);
                let currentY = startY;

                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (['、', '。'].includes(char)) {
                        ctx.fillText(char, currentX + 15, currentY - 15);
                    } else if (['ー', '―', '-'].includes(char)) {
                        ctx.save();
                        ctx.translate(currentX + 15, currentY + 15);
                        ctx.rotate(Math.PI / 2);
                        ctx.fillText(char, 0, 0);
                        ctx.restore();
                    } else {
                        ctx.fillText(char, currentX, currentY);
                    }
                    currentY += 42;
                }
            });

            // 4. 下部タイトル＆巻数枠の描画（自動折り返し対応）
            const volNum = volNumInput.value || "";
            const volTitle = (volTitleInput.value || "").toUpperCase();

            const boxWidth = 480; 
            const maxTitleTextWidth = 360;
            
            ctx.font = '800 22px "Noto Serif JP", sans-serif';
            
            const words = volTitle.split(' ');
            let titleLines = [];
            let currentLine = '';

            words.forEach(word => {
                const testLine = currentLine ? currentLine + ' ' + word : word;
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxTitleTextWidth && currentLine) {
                    titleLines.push(currentLine);
                    currentLine = word;
                } else {
                    currentLine = testLine;
                }
            });
            if (currentLine) titleLines.push(currentLine);

            const titleLineHeight = 28;
            const computedHeight = Math.max(80, (titleLines.length * titleLineHeight) + 24);

            const boxX = (width - boxWidth) / 2;
            const boxY = height - computedHeight - 60;

            ctx.strokeStyle = textColor;
            ctx.lineWidth = 6;
            ctx.strokeRect(boxX, boxY, boxWidth, computedHeight);

            ctx.fillStyle = textColor;
            ctx.font = '900 32px "Noto Serif JP", sans-serif';
            ctx.textBaseline = 'middle';
            ctx.fillText(volNum, boxX + 20, boxY + (computedHeight / 2));

            ctx.font = '800 22px "Noto Serif JP", sans-serif';
            const titleStartX = boxX + 75;
            const startTitleY = boxY + (computedHeight - (titleLines.length * titleLineHeight)) / 2 + (titleLineHeight / 2);

            titleLines.forEach((tLine, index) => {
                ctx.fillText(tLine, titleStartX, startTitleY + (index * titleLineHeight));
            });

            return canvas;
        }

        // 長押し保存用オーバーレイのデータ生成
        function generateOverlayImage() {
            setTimeout(() => {
                const canvas = generateCanvas();
                longPressOverlay.src = canvas.toDataURL('image/jpeg', 0.92);
            }, 50);
        }

        // プレビューの見た目を再現した高精度 JPEG 画像ダウンロード
        function downloadImage() {
            const canvas = generateCanvas();
            const link = document.createElement('a');
            link.download = `bleach_poem_${Date.now()}.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 0.92);
            link.click();
        }
    </script>
