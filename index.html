<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BLEACH風ポエムジェネレーター</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2canvas CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#e50914',
              dark: '#0f0f10',
              card: '#18181b',
              border: '#27272a',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* 縦書き設定 */
    .vertical-text {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: 0.15em;
      line-height: 2.2;
    }
    
    /* スライダー カスタマイズ */
    input[type=range] {
      accent-color: #e50914;
    }

    /* プレビュー縮小スケール保持 */
    .preview-container {
      touch-action: pan-y;
    }
  </style>
</head>
<body class="bg-brand-dark text-gray-100 min-h-screen pb-12 font-sans antialiased selection:bg-brand-red selection:text-white">

  <!-- ヘッダー -->
  <header class="border-b border-brand-border bg-brand-dark/95 backdrop-blur sticky top-0 z-50">
    <div class="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="bg-brand-red text-white text-xs font-bold px-2 py-0.5 rounded">POEM</span>
        <h1 class="font-extrabold tracking-wider text-sm sm:text-base">BLEACH<span class="font-normal text-xs text-gray-400 ml-1">風 ポエムジェネレーター</span></h1>
      </div>
      
      <!-- 白黒背景切り替え -->
      <div class="flex items-center bg-zinc-900 border border-brand-border rounded-lg p-1 text-xs">
        <button id="btnThemeDark" onclick="setCardTheme('dark')" class="px-2.5 py-1 rounded-md font-medium transition-all bg-zinc-700 text-white shadow">黒背景</button>
        <button id="btnThemeLight" onclick="setCardTheme('light')" class="px-2.5 py-1 rounded-md font-medium transition-all text-gray-400 hover:text-white">白背景</button>
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-3 sm:px-4 pt-3 space-y-4">

    <!-- ① プレビューエリア（折りたたみ可能・スマホに優しいSticky） -->
    <section class="sticky top-14 z-40 bg-brand-dark/95 backdrop-blur-md pb-2 pt-1 border-b border-brand-border/50 transition-all">
      <div class="flex items-center justify-between mb-1.5 px-1">
        <span class="text-xs font-bold text-gray-400 flex items-center gap-1">
          <span>👁 プレビュー</span>
          <span class="text-[10px] font-normal text-gray-500">(リアルタイム反映)</span>
        </span>
        
        <!-- 折りたたみトグルボタン -->
        <button id="btnTogglePreview" onclick="togglePreviewFold()" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-gray-300 px-2.5 py-1 rounded-full border border-zinc-700 flex items-center gap-1 active:scale-95 transition">
          <span id="toggleIcon">▲</span> <span id="toggleText">たたむ</span>
        </button>
      </div>

      <!-- プレビュー表示本体 -->
      <div id="previewWrapper" class="overflow-hidden transition-all duration-300 max-h-[50vh] flex justify-center items-center py-1">
        <div id="poemCard" class="w-full max-w-[340px] sm:max-w-[380px] bg-black text-white p-5 sm:p-6 transition-colors duration-200 shadow-2xl rounded border border-zinc-800 flex flex-col items-center">
          
          <!-- 横長極細画像エリア (高さ1/3削減 & アスペクト比細長) -->
          <div id="imageFrame" class="w-full h-16 sm:h-20 bg-zinc-900 overflow-hidden relative border border-zinc-800 cursor-grab active:cursor-grabbing group rounded-sm select-none">
            <img id="cardImage" class="w-full h-full object-cover pointer-events-none origin-center" src="" alt="" style="display: none;">
            <div id="imagePlaceholder" class="w-full h-full flex flex-col items-center justify-center text-zinc-600 text-[10px] gap-1">
              <span>画像未設定</span>
            </div>
          </div>

          <!-- 縦書きポエム本文 -->
          <div class="my-6 min-h-[160px] sm:min-h-[180px] flex items-center justify-center w-full">
            <div id="cardPoem" class="vertical-text text-sm sm:text-base font-serif whitespace-pre-wrap tracking-widest leading-loose max-h-[220px] overflow-hidden">
僕たちは 伸ばす手に
駆ける髪に
背中に届く まぶしい光に
似た何かを夢見ている
            </div>
          </div>

          <!-- 巻数 & 詩タイトル（幅1/3サイズ・高め・中央配置） -->
          <div class="w-full flex justify-center mt-2">
            <div id="cardFooterBox" class="w-1/3 min-w-[110px] border-2 border-white py-2 px-1.5 text-center flex flex-col items-center justify-center gap-1 bg-transparent">
              <div id="cardVolNum" class="font-extrabold text-sm sm:text-base leading-none border-b border-current pb-1 w-full truncate">1.</div>
              <div id="cardTitle" class="font-extrabold text-[10px] sm:text-xs leading-tight tracking-wider uppercase break-words w-full">
                THE DEATH AND THE STRAWBERRY
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- ダウンロードボタン -->
      <div class="mt-2 flex justify-center">
        <button onclick="downloadImage()" class="w-full max-w-[340px] bg-brand-red hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg shadow-lg active:scale-[0.98] transition text-sm flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          画像をダウンロード保存
        </button>
      </div>
    </section>

    <!-- ② 編集コントロールエリア -->
    <div class="space-y-4 pt-2">

      <!-- 1. 画像設定 -->
      <section class="bg-brand-card p-3.5 sm:p-4 rounded-xl border border-brand-border space-y-3">
        <h2 class="text-xs font-bold text-gray-300 flex items-center gap-1.5">
          <span class="text-brand-red">1.</span> 横長画像設定 (自動モノクロ化)
        </h2>

        <!-- ファイルアップロード -->
        <label class="border-2 border-dashed border-zinc-700 hover:border-brand-red rounded-lg p-3 text-center cursor-pointer block bg-zinc-900/50 hover:bg-zinc-900 transition">
          <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
          <div class="text-xs text-gray-400">
            <span class="text-brand-red font-bold">タップして画像を選択</span>
          </div>
        </label>

        <!-- コントロールスライダー群 -->
        <div class="space-y-2.5 text-xs pt-1">
          <div>
            <div class="flex justify-between text-gray-400 mb-1">
              <span>上下位置 (トリミング)</span>
              <span id="valPosY" class="font-mono text-gray-200">50%</span>
            </div>
            <input type="range" id="sliderPosY" min="0" max="100" value="50" class="w-full h-1.5 bg-zinc-800 rounded-lg appearance-none cursor-pointer" oninput="updateImageTransform()">
          </div>

          <div>
            <div class="flex justify-between text-gray-400 mb-1">
              <span>ズーム (拡大率)</span>
              <span id="valZoom" class="font-mono text-gray-200">1.0x</span>
            </div>
            <input type="range" id="sliderZoom" min="1" max="3" step="0.1" value="1" class="w-full h-1.5 bg-zinc-800 rounded-lg appearance-none cursor-pointer" oninput="updateImageTransform()">
          </div>

          <div>
            <div class="flex justify-between text-gray-400 mb-1">
              <span>コントラスト (白黒強弱)</span>
              <span id="valContrast" class="font-mono text-gray-200">120%</span>
            </div>
            <input type="range" id="sliderContrast" min="50" max="250" value="120" class="w-full h-1.5 bg-zinc-800 rounded-lg appearance-none cursor-pointer" oninput="updateImageTransform()">
          </div>
        </div>
      </section>

      <!-- 2. ポエム本文 -->
      <section class="bg-brand-card p-3.5 sm:p-4 rounded-xl border border-brand-border space-y-2">
        <div class="flex justify-between items-center">
          <h2 class="text-xs font-bold text-gray-300 flex items-center gap-1.5">
            <span class="text-brand-red">2.</span> 詩（ポエム）本文
          </h2>
          <button onclick="applySamplePoem()" class="text-[11px] text-brand-red hover:underline font-medium">サンプル適用</button>
        </div>
        <textarea id="inputPoem" rows="4" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2.5 text-xs text-gray-100 focus:outline-none focus:border-brand-red transition font-serif leading-relaxed" placeholder="ポエムを入力してください..." oninput="updateText()"></textarea>
      </section>

      <!-- 3. 巻数 & タイトル -->
      <section class="bg-brand-card p-3.5 sm:p-4 rounded-xl border border-brand-border space-y-3">
        <h2 class="text-xs font-bold text-gray-300 flex items-center gap-1.5">
          <span class="text-brand-red">3.</span> 巻数 & 詩タイトル
        </h2>
        <div class="grid grid-cols-3 gap-2">
          <div class="col-span-1">
            <label class="text-[10px] text-gray-400 block mb-1">巻数数字</label>
            <input type="text" id="inputVolNum" value="1." class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 text-xs text-gray-100 focus:outline-none focus:border-brand-red font-bold" oninput="updateText()">
          </div>
          <div class="col-span-2">
            <label class="text-[10px] text-gray-400 block mb-1">英語タイトル</label>
            <input type="text" id="inputTitle" value="THE DEATH AND THE STRAWBERRY" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 text-xs text-gray-100 focus:outline-none focus:border-brand-red font-bold uppercase" oninput="updateText()">
          </div>
        </div>
      </section>

    </div>
  </main>

  <script>
    // 状態変数
    let currentTheme = 'dark';
    let isPreviewFolded = false;

    // 初期化
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('inputPoem').value = `僕たちは 伸ばす手に\n駆ける髪に\n背中に届く まぶしい光に\n似た何かを夢見ている`;
      updateText();
      setupTouchDrag();
    });

    // プレビューの折りたたみ機能
    function togglePreviewFold() {
      const wrapper = document.getElementById('previewWrapper');
      const icon = document.getElementById('toggleIcon');
      const text = document.getElementById('toggleText');

      isPreviewFolded = !isPreviewFolded;

      if (isPreviewFolded) {
        wrapper.style.maxHeight = '0px';
        wrapper.style.opacity = '0';
        wrapper.style.padding = '0px';
        icon.innerText = '▼';
        text.innerText = '開く';
      } else {
        wrapper.style.maxHeight = '50vh';
        wrapper.style.opacity = '1';
        wrapper.style.padding = '4px 0';
        icon.innerText = '▲';
        text.innerText = 'たたむ';
      }
    }

    // リアルタイムテキスト反映
    function updateText() {
      const poem = document.getElementById('inputPoem').value;
      const vol = document.getElementById('inputVolNum').value;
      const title = document.getElementById('inputTitle').value;

      document.getElementById('cardPoem').innerText = poem || ' ';
      document.getElementById('cardVolNum').innerText = vol || '';
      document.getElementById('cardTitle').innerText = title || '';
    }

    // サンプル詩適用
    function applySamplePoem() {
      document.getElementById('inputPoem').value = `僕たちは 伸ばす手に\n駆ける髪に\n背中に届く まぶしい光に\n似た何かを夢見ている`;
      document.getElementById('inputVolNum').value = "1.";
      document.getElementById('inputTitle').value = "THE DEATH AND THE STRAWBERRY";
      updateText();
    }

    // テーマ切り替え (白背景 / 黒背景)
    function setCardTheme(theme) {
      currentTheme = theme;
      const card = document.getElementById('poemCard');
      const footerBox = document.getElementById('cardFooterBox');
      const btnDark = document.getElementById('btnThemeDark');
      const btnLight = document.getElementById('btnThemeLight');

      if (theme === 'dark') {
        card.classList.remove('bg-white', 'text-black');
        card.classList.add('bg-black', 'text-white');
        footerBox.style.borderColor = '#ffffff';

        btnDark.className = "px-2.5 py-1 rounded-md font-medium transition-all bg-zinc-700 text-white shadow";
        btnLight.className = "px-2.5 py-1 rounded-md font-medium transition-all text-gray-400 hover:text-white";
      } else {
        card.classList.remove('bg-black', 'text-white');
        card.classList.add('bg-white', 'text-black');
        footerBox.style.borderColor = '#000000';

        btnLight.className = "px-2.5 py-1 rounded-md font-medium transition-all bg-zinc-200 text-black shadow";
        btnDark.className = "px-2.5 py-1 rounded-md font-medium transition-all text-gray-400 hover:text-white";
      }
    }

    // 画像アップロード処理
    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = document.getElementById('cardImage');
        img.src = event.target.result;
        img.style.display = 'block';
        document.getElementById('imagePlaceholder').style.display = 'none';
        updateImageTransform();
      };
      reader.readAsDataURL(file);
    }

    // 画像トランスフォーム＆モノクロ化更新
    function updateImageTransform() {
      const posY = document.getElementById('sliderPosY').value;
      const zoom = document.getElementById('sliderZoom').value;
      const contrast = document.getElementById('sliderContrast').value;

      document.getElementById('valPosY').innerText = `${posY}%`;
      document.getElementById('valZoom').innerText = `${zoom}x`;
      document.getElementById('valContrast').innerText = `${contrast}%`;

      const img = document.getElementById('cardImage');
      img.style.objectPosition = `center ${posY}%`;
      img.style.transform = `scale(${zoom})`;
      img.style.filter = `grayscale(100%) contrast(${contrast}%)`;
    }

    // 画像領域での直接タッチドラッグ調整
    function setupTouchDrag() {
      const frame = document.getElementById('imageFrame');
      let startY = 0;
      let startVal = 50;
      let isDragging = false;

      const onStart = (e) => {
        isDragging = true;
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        startVal = parseInt(document.getElementById('sliderPosY').value);
      };

      const onMove = (e) => {
        if (!isDragging) return;
        const currentY = e.touches ? e.touches[0].clientY : e.clientY;
        const deltaY = currentY - startY;
        let newVal = startVal - Math.round(deltaY * 0.5);
        newVal = Math.max(0, Math.min(100, newVal));

        document.getElementById('sliderPosY').value = newVal;
        updateImageTransform();
      };

      const onEnd = () => { isDragging = false; };

      frame.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);

      frame.addEventListener('touchstart', onStart, {passive: true});
      window.addEventListener('touchmove', onMove, {passive: true});
      window.addEventListener('touchend', onEnd);
    }

    // PNG画像ダウンロード保存
    function downloadImage() {
      const card = document.getElementById('poemCard');
      
      // 折りたたまれている場合は一時展開
      const wasFolded = isPreviewFolded;
      if (wasFolded) togglePreviewFold();

      html2canvas(card, {
        scale: 3, // 高解像度出力
        useCORS: true,
        backgroundColor: currentTheme === 'dark' ? '#000000' : '#ffffff'
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `bleach_poem_${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();

        if (wasFolded) togglePreviewFold();
      });
    }
  </script>
</body>
</html>
