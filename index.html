<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLEACH風 ポエムジェネレーター</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121214',
                        cardBg: '#1e1e24',
                        accentRed: '#e50914'
                    },
                    fontFamily: {
                        serif: ['"Shippori Mincho"', '"Noto Serif JP"', 'serif'],
                        sans: ['"Inter"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts for BLEACH-like typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        /* 縦書きモード指定 */
        .writing-vertical {
            writing-mode: vertical-rl;
            text-orientation: upright;
        }
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 3px;
        }
        /* ポエムカードのスマホフィット */
        .poem-card-container {
            width: 100%;
            max-width: 380px;
            aspect-ratio: 1 / 1.5;
        }
    </style>
</head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen flex flex-col antialiased selection:bg-rose-500 selection:text-white pb-6">

    <!-- Header Area -->
    <header class="border-b border-zinc-800 bg-zinc-950/90 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-3 py-2 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="bg-accentRed text-white text-[10px] sm:text-xs font-bold px-2 py-0.5 rounded tracking-wider">POEM</span>
                <h1 class="text-base sm:text-lg font-bold tracking-wider text-white flex items-center gap-1.5">
                    BLEACH <span class="text-[10px] sm:text-xs font-normal text-zinc-400">ジェネレーター</span>
                </h1>
            </div>

            <!-- 背景色切り替えトグル (ポエムカード出力用) -->
            <div class="bg-zinc-900 border border-zinc-700/80 p-0.5 rounded-lg flex items-center gap-1 shadow-inner">
                <button id="btnBgDark" onclick="setPreviewBg('dark')" class="px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 bg-zinc-700 text-white shadow-sm min-h-[32px]">
                    <span class="w-2 h-2 rounded-full bg-black border border-zinc-500 inline-block"></span> 黒
                </button>
                <button id="btnBgLight" onclick="setPreviewBg('light')" class="px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 text-zinc-400 hover:text-white min-h-[32px]">
                    <span class="w-2 h-2 rounded-full bg-white inline-block"></span> 白
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-3 pt-2 flex-1 w-full flex flex-col gap-4">

        <!-- リアルタイムプレビュー画面 -->
        <section class="w-full flex flex-col items-center gap-2 border-b border-zinc-800/80 pb-3 pt-1">
            <div class="w-full max-w-[380px] flex items-center justify-between px-1">
                <div class="flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-accentRed" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                    <h2 class="text-xs sm:text-sm font-bold text-white tracking-wide">リアルタイムプレビュー</h2>
                </div>
                <button onclick="downloadImage()" class="bg-accentRed hover:bg-rose-600 active:scale-95 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition shadow-lg shadow-rose-950/50 flex items-center gap-1.5 min-h-[36px]">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    保存 (JPEG)
                </button>
            </div>

            <!-- BLEACH巻頭風ポエムカード本体 (プレビュー) -->
            <div class="w-full flex justify-center py-1">
                <div id="poemCard" class="poem-card-container bg-black text-white p-4 sm:p-5 transition-colors duration-300 shadow-2xl rounded-sm flex flex-col justify-between border border-zinc-800 relative select-none">
                    
                    <!-- ① 横長モノクロ画像表示枠 -->
                    <div id="imageDisplayBox" onclick="openCropModal()" class="w-full h-14 sm:h-16 bg-zinc-900 relative overflow-hidden flex items-center justify-center border border-zinc-800/50 cursor-pointer group">
                        <img id="previewImg" src="" alt="ポエム用画像" class="absolute max-w-none hidden pointer-events-none transition-all">
                        <div id="imgPlaceholder" class="text-zinc-500 text-[11px] text-center px-2 flex items-center gap-1 group-hover:text-zinc-300">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            タップして画像を選択・編集
                        </div>
                    </div>

                    <!-- 縦書きポエムテキスト領域 -->
                    <div class="my-2 flex-1 flex justify-center items-center min-h-[180px] py-1 overflow-hidden">
                        <div id="previewPoem" class="writing-vertical font-serif text-base sm:text-lg tracking-[0.2em] leading-[2em] max-h-[260px] flex flex-row-reverse flex-wrap items-center justify-center whitespace-pre-wrap">
                        </div>
                    </div>

                    <!-- ② 巻数＆詩タイトル枠 -->
                    <div class="pt-1 flex justify-center items-center">
                        <div id="previewTitleBorder" class="border-[3px] border-white px-2.5 py-1.5 flex items-center gap-2 font-extrabold tracking-wider max-w-[260px] sm:max-w-[290px] min-h-[52px]">
                            <span id="previewVolNum" class="text-base sm:text-lg font-black leading-none shrink-0">1.</span>
                            <span id="previewVolTitle" class="text-[11px] sm:text-xs font-extrabold uppercase tracking-widest leading-tight break-words">THE DEATH AND THE STRAWBERRY</span>
                        </div>
                    </div>

                    <!-- 長押し保存用リアルタイムオーバーレイ画像 -->
                    <img id="longPressOverlay" alt="Long press to save" class="absolute inset-0 w-full h-full opacity-0 z-10 cursor-pointer pointer-events-auto" title="長押しまたは右クリックで画像を保存">
                </div>
            </div>
            <p class="text-[10px] text-zinc-500 text-center">※ プレビュー画像を長押し / 右クリックで直接保存も可能です</p>
        </section>

        <!-- 下部：コンパクト3カラム編集パネル -->
        <section class="w-full grid grid-cols-1 md:grid-cols-3 gap-3">
            
            <!-- 1. 横長画像設定 -->
            <div class="bg-cardBg/90 border border-zinc-800 rounded-xl p-3 shadow-lg flex flex-col justify-between space-y-2">
                <h3 class="text-xs font-semibold text-zinc-300 flex items-center justify-between">
                    <span>1. 画像設定 <span class="text-[10px] text-zinc-500 font-normal">(モノクロ)</span></span>
                </h3>
                
                <div id="dropZone" onclick="openCropModal()" 
                     class="border-2 border-dashed border-zinc-700 hover:border-accentRed/70 bg-zinc-900/50 hover:bg-zinc-900 transition cursor-pointer rounded-lg p-2.5 text-center group flex flex-col items-center justify-center flex-1 min-h-[70px]">
                    <svg class="w-5 h-5 text-zinc-500 group-hover:text-accentRed transition mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                    </svg>
                    <p class="text-[11px] text-zinc-400 group-hover:text-zinc-200">画像をアップロード / 再編集</p>
                    <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                </div>

                <button onclick="openCropModal()" id="btnEditCrop" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs py-1.5 rounded transition hidden">
                    トリミング位置・拡大を再調整
                </button>
            </div>

            <!-- 2. 詩 (ポエム) 本文 -->
            <div class="bg-cardBg/90 border border-zinc-800 rounded-xl p-3 shadow-lg flex flex-col space-y-2">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-semibold text-zinc-300">2. 詩本文</h3>
                    <button onclick="applySamplePoem()" class="text-[11px] text-accentRed hover:text-rose-400 underline transition">
                        サンプル
                    </button>
                </div>
                <textarea id="poemInput" rows="3" placeholder="ここに詩を入力（改行で列変更）"
                    class="w-full flex-1 bg-zinc-900 border border-zinc-700 rounded-lg p-2 text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-accentRed transition leading-relaxed resize-none min-h-[70px]"
                    oninput="updateControls()"></textarea>
            </div>

            <!-- 3. 巻数数字 & 詩タイトル -->
            <div class="bg-cardBg/90 border border-zinc-800 rounded-xl p-3 shadow-lg flex flex-col justify-between space-y-2">
                <h3 class="text-xs font-semibold text-zinc-300">3. 巻数＆タイトル</h3>
                <div class="space-y-1.5">
                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-0.5">巻数数字</label>
                        <input type="text" id="volNumInput" value="1." placeholder="例: 1."
                            class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-2.5 py-1 text-xs text-zinc-100 focus:outline-none focus:border-accentRed min-h-[32px]"
                            oninput="updateControls()">
                    </div>
                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-0.5">詩タイトル (自動折り返し)</label>
                        <input type="text" id="volTitleInput" value="THE DEATH AND THE STRAWBERRY" placeholder="例: THE DEATH AND..."
                            class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-2.5 py-1 text-xs text-zinc-100 focus:outline-none focus:border-accentRed min-h-[32px]"
                            oninput="updateControls()">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 画像トリミング・位置調整用モーダル -->
    <div id="cropModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-3">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-lg rounded-2xl p-4 flex flex-col gap-3 shadow-2xl">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
                <h3 class="text-sm font-bold text-white flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-accentRed" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    画像のトリミング＆調整
                </h3>
                <button onclick="closeCropModal()" class="text-zinc-400 hover:text-white p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <p class="text-[11px] text-zinc-400 text-center">枠内をドラッグで移動 / ホイール・ピンチ操作で拡大縮小</p>

            <!-- プレビューと完全同等のアスペクト比 (6:1) のビューポート -->
            <div id="cropViewport" class="w-full aspect-[6/1] bg-black relative overflow-hidden border-2 border-accentRed/80 rounded touch-none cursor-grab active:cursor-grabbing flex items-center justify-center">
                <img id="cropImg" src="" alt="Crop image" class="absolute max-w-none pointer-events-none select-none origin-top-left">
            </div>

            <!-- 操作コントロール -->
            <div class="space-y-3 pt-1">
                <div class="flex items-center gap-2">
                    <span class="text-xs text-zinc-400 w-16 shrink-0">ズーム</span>
                    <button onclick="adjustZoom(-0.1)" class="bg-zinc-800 hover:bg-zinc-700 text-white w-7 h-7 rounded flex items-center justify-center font-bold text-sm shrink-0">-</button>
                    <input type="range" id="cropZoomRange" min="1" max="4" step="0.02" value="1" class="w-full accent-rose-500" oninput="onCropZoomInput(this.value)">
                    <button onclick="adjustZoom(0.1)" class="bg-zinc-800 hover:bg-zinc-700 text-white w-7 h-7 rounded flex items-center justify-center font-bold text-sm shrink-0">+</button>
                </div>

                <div class="flex items-center gap-2">
                    <span class="text-xs text-zinc-400 w-16 shrink-0">コントラスト</span>
                    <input type="range" id="cropContrastRange" min="50" max="250" value="130" class="w-full accent-rose-500" oninput="onCropContrastInput(this.value)">
                    <span id="cropContrastVal" class="text-xs text-zinc-400 w-10 text-right shrink-0">130%</span>
                </div>
            </div>

            <div class="flex gap-2 pt-2 border-t border-zinc-800">
                <button onclick="document.getElementById('imageInput').click()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-semibold px-3 py-2 rounded-lg transition min-h-[38px]">
                    別の画像を選択
                </button>
                <button onclick="applyCrop()" class="flex-1 bg-accentRed hover:bg-rose-600 text-white text-xs font-bold py-2 rounded-lg transition min-h-[38px] shadow-lg shadow-rose-950/50">
                    完了（適用する）
                </button>
            </div>
        </div>
    </div>

    <!-- Canvas (画像生成用非表示キャンバス) -->
    <canvas id="exportCanvas" class="hidden"></canvas>

    <!-- App Main Script -->
    <script>
        // State
        let currentTheme = 'dark';
        let rawImageObj = null;

        // Image crop transform state
        let cropState = {
            x: 0,
            y: 0,
            scale: 1,
            contrast: 130
        };

        const defaultPoem = "僕たちは 伸ばす手に\n駆ける髪に\n背中に届く まぶしい光に\n似た何かを夢見ている";

        // DOM Elements
        const poemInput = document.getElementById('poemInput');
        const volNumInput = document.getElementById('volNumInput');
        const volTitleInput = document.getElementById('volTitleInput');
        
        const previewPoem = document.getElementById('previewPoem');
        const previewVolNum = document.getElementById('previewVolNum');
        const previewVolTitle = document.getElementById('previewVolTitle');
        const previewImg = document.getElementById('previewImg');
        const imgPlaceholder = document.getElementById('imgPlaceholder');
        const poemCard = document.getElementById('poemCard');
        const previewTitleBorder = document.getElementById('previewTitleBorder');
        const imageDisplayBox = document.getElementById('imageDisplayBox');

        const cropModal = document.getElementById('cropModal');
        const cropViewport = document.getElementById('cropViewport');
        const cropImg = document.getElementById('cropImg');
        const cropZoomRange = document.getElementById('cropZoomRange');
        const cropContrastRange = document.getElementById('cropContrastRange');

        window.onload = () => {
            poemInput.value = defaultPoem;
            updateControls();
            setupCropInteractions();
            
            // Drag and drop setup
            const dropZone = document.getElementById('dropZone');
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('border-accentRed');
            });
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('border-accentRed');
            });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('border-accentRed');
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    loadImageFile(e.dataTransfer.files[0]);
                }
            });
        };

        // Open/Close Modal
        function openCropModal() {
            if (!rawImageObj) {
                document.getElementById('imageInput').click();
                return;
            }
            cropModal.classList.remove('hidden');
            initCropTransform();
        }

        function closeCropModal() {
            cropModal.classList.add('hidden');
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                loadImageFile(file);
            }
        }

        function loadImageFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    rawImageObj = img;
                    cropImg.src = e.target.result;
                    cropState = { x: 0, y: 0, scale: 1, contrast: 130 };
                    openCropModal();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Initialize crop image size and fit inside cropViewport
        function initCropTransform() {
            if (!rawImageObj) return;
            const vw = cropViewport.clientWidth;
            const vh = cropViewport.clientHeight;

            // Compute default cover scale
            const scaleX = vw / rawImageObj.width;
            const scaleY = vh / rawImageObj.height;
            const baseCoverScale = Math.max(scaleX, scaleY);

            // Keep base dimension
            cropState.baseW = rawImageObj.width * baseCoverScale;
            cropState.baseH = rawImageObj.height * baseCoverScale;
            
            cropZoomRange.value = cropState.scale;
            cropContrastRange.value = cropState.contrast;
            document.getElementById('cropContrastVal').innerText = `${cropState.contrast}%`;

            clampCropPosition();
            renderCropModalImage();
        }

        function clampCropPosition() {
            const vw = cropViewport.clientWidth;
            const vh = cropViewport.clientHeight;
            const currentW = cropState.baseW * cropState.scale;
            const currentH = cropState.baseH * cropState.scale;

            const minX = vw - currentW;
            const maxX = 0;
            const minY = vh - currentH;
            const maxY = 0;

            cropState.x = Math.min(maxX, Math.max(minX, cropState.x));
            cropState.y = Math.min(maxY, Math.max(minY, cropState.y));
        }

        function renderCropModalImage() {
            if (!rawImageObj) return;
            const currentW = cropState.baseW * cropState.scale;
            const currentH = cropState.baseH * cropState.scale;

            cropImg.style.width = `${currentW}px`;
            cropImg.style.height = `${currentH}px`;
            cropImg.style.transform = `translate3d(${cropState.x}px, ${cropState.y}px, 0px)`;
            cropImg.style.filter = `grayscale(100%) contrast(${cropState.contrast}%)`;
        }

        // Touch & Mouse Drag / Pinch Zoom handlers in Modal
        function setupCropInteractions() {
            let isDragging = false;
            let startX = 0, startY = 0;
            let initialCropX = 0, initialCropY = 0;
            let initialPinchDist = 0;
            let startScale = 1;

            const getTouchDist = (e) => {
                return Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            };

            const onStart = (clientX, clientY) => {
                isDragging = true;
                startX = clientX;
                startY = clientY;
                initialCropX = cropState.x;
                initialCropY = cropState.y;
            };

            const onMove = (clientX, clientY) => {
                if (!isDragging) return;
                const dx = clientX - startX;
                const dy = clientY - startY;
                cropState.x = initialCropX + dx;
                cropState.y = initialCropY + dy;
                clampCropPosition();
                renderCropModalImage();
            };

            const onEnd = () => {
                isDragging = false;
            };

            cropViewport.addEventListener('mousedown', (e) => onStart(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', onEnd);

            cropViewport.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    onStart(e.touches[0].clientX, e.touches[0].clientY);
                } else if (e.touches.length === 2) {
                    isDragging = false;
                    initialPinchDist = getTouchDist(e);
                    startScale = cropState.scale;
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length === 1) {
                    onMove(e.touches[0].clientX, e.touches[0].clientY);
                } else if (e.touches.length === 2 && initialPinchDist > 0) {
                    const dist = getTouchDist(e);
                    const factor = dist / initialPinchDist;
                    cropState.scale = Math.max(1, Math.min(4, startScale * factor));
                    cropZoomRange.value = cropState.scale;
                    clampCropPosition();
                    renderCropModalImage();
                }
            }, { passive: true });

            window.addEventListener('touchend', onEnd);

            // Wheel Zoom
            cropViewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY < 0 ? 0.08 : -0.08;
                cropState.scale = Math.max(1, Math.min(4, cropState.scale + delta));
                cropZoomRange.value = cropState.scale;
                clampCropPosition();
                renderCropModalImage();
            }, { passive: false });
        }

        function adjustZoom(delta) {
            cropState.scale = Math.max(1, Math.min(4, cropState.scale + delta));
            cropZoomRange.value = cropState.scale;
            clampCropPosition();
            renderCropModalImage();
        }

        function onCropZoomInput(val) {
            cropState.scale = parseFloat(val);
            clampCropPosition();
            renderCropModalImage();
        }

        function onCropContrastInput(val) {
            cropState.contrast = parseInt(val);
            document.getElementById('cropContrastVal').innerText = `${val}%`;
            renderCropModalImage();
        }

        // Apply crop settings to Main Preview
        function applyCrop() {
            closeCropModal();
            document.getElementById('btnEditCrop').classList.remove('hidden');

            previewImg.src = rawImageObj.src;
            previewImg.classList.remove('hidden');
            imgPlaceholder.classList.add('hidden');

            // Apply transformed style onto preview box
            const vw = imageDisplayBox.clientWidth;
            const vh = imageDisplayBox.clientHeight;

            const scaleX = vw / rawImageObj.width;
            const scaleY = vh / rawImageObj.height;
            const baseCoverScale = Math.max(scaleX, scaleY);

            const baseW = rawImageObj.width * baseCoverScale;
            const baseH = rawImageObj.height * baseCoverScale;

            const modalVW = cropViewport.clientWidth || 1;
            const ratio = vw / modalVW;

            const renderW = baseW * cropState.scale * ratio;
            const renderH = baseH * cropState.scale * ratio;
            const renderX = cropState.x * ratio;
            const renderY = cropState.y * ratio;

            previewImg.style.width = `${renderW}px`;
            previewImg.style.height = `${renderH}px`;
            previewImg.style.left = `0px`;
            previewImg.style.top = `0px`;
            previewImg.style.transform = `translate3d(${renderX}px, ${renderY}px, 0px)`;
            previewImg.style.filter = `grayscale(100%) contrast(${cropState.contrast}%)`;

            updateControls();
        }

        function applySamplePoem() {
            poemInput.value = defaultPoem;
            volNumInput.value = "1.";
            volTitleInput.value = "THE DEATH AND THE STRAWBERRY";
            updateControls();
        }

        function setPreviewBg(mode) {
            currentTheme = mode;
            const btnDark = document.getElementById('btnBgDark');
            const btnLight = document.getElementById('btnBgLight');

            if (mode === 'dark') {
                poemCard.style.backgroundColor = '#000000';
                poemCard.style.color = '#ffffff';
                previewTitleBorder.style.borderColor = '#ffffff';

                btnDark.className = "px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 bg-zinc-700 text-white shadow-sm min-h-[32px]";
                btnLight.className = "px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 text-zinc-400 hover:text-white min-h-[32px]";
            } else {
                poemCard.style.backgroundColor = '#ffffff';
                poemCard.style.color = '#000000';
                previewTitleBorder.style.borderColor = '#000000';

                btnLight.className = "px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 bg-zinc-200 text-zinc-900 font-bold shadow-sm min-h-[32px]";
                btnDark.className = "px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 text-zinc-400 hover:text-white min-h-[32px]";
            }
            updateControls();
        }

        function updateControls() {
            previewPoem.innerText = poemInput.value || " ";
            previewVolNum.innerText = volNumInput.value || "";
            previewVolTitle.innerText = volTitleInput.value || "";

            // リアルタイムオーバーレイ画像を非同期生成（長押し保存対応）
            updateOverlayImage();
        }

        // Canvas描画ロジック (位置ズレ皆無・アスペクト比完全同期)
        function renderCardToCanvas(callback) {
            const canvas = document.getElementById('exportCanvas');
            const ctx = canvas.getContext('2d');

            const width = 800;
            const height = 1200;
            canvas.width = width;
            canvas.height = height;

            const isDark = currentTheme === 'dark';
            const bgColor = isDark ? '#000000' : '#ffffff';
            const textColor = isDark ? '#ffffff' : '#000000';

            // 1. 背景色
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, width, height);

            // 2. 画像描画 (プレビューとアスペクト比完全同一)
            const imgBoxX = 60;
            const imgBoxY = 60;
            const imgBoxWidth = width - 120;
            const imgBoxHeight = 133; // 6:1 のアスペクト比に完全適合

            if (rawImageObj) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(imgBoxX, imgBoxY, imgBoxWidth, imgBoxHeight);
                ctx.clip();

                ctx.filter = `grayscale(100%) contrast(${cropState.contrast}%)`;

                const modalVW = cropViewport.clientWidth || 300;
                const ratio = imgBoxWidth / modalVW;

                const baseCoverScale = Math.max(modalVW / rawImageObj.width, (modalVW / 6) / rawImageObj.height);
                const baseW = rawImageObj.width * baseCoverScale;
                const baseH = rawImageObj.height * baseCoverScale;

                const renderW = baseW * cropState.scale * ratio;
                const renderH = baseH * cropState.scale * ratio;
                const drawX = imgBoxX + (cropState.x * ratio);
                const drawY = imgBoxY + (cropState.y * ratio);

                ctx.drawImage(rawImageObj, drawX, drawY, renderW, renderH);
                ctx.restore();
            } else {
                ctx.strokeStyle = isDark ? '#333333' : '#cccccc';
                ctx.lineWidth = 2;
                ctx.strokeRect(imgBoxX, imgBoxY, imgBoxWidth, imgBoxHeight);
            }

            // 3. 縦書きポエムテキスト領域（完全に左右中央寄せ配置）
            ctx.fillStyle = textColor;
            ctx.font = '700 34px "Shippori Mincho", "Noto Serif JP", serif';
            ctx.textBaseline = 'top';

            const lines = (poemInput.value || " ").split('\n');
            const lineSpacing = 60;
            const charHeight = 42;

            const totalPoemWidth = (lines.length - 1) * lineSpacing;
            const startX = (width / 2) + (totalPoemWidth / 2);
            const startY = 250;

            lines.forEach((line, lineIndex) => {
                const currentX = startX - (lineIndex * lineSpacing);
                let currentY = startY;

                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (['、', '。'].includes(char)) {
                        ctx.fillText(char, currentX + 15, currentY - 15);
                    } else if (['ー', '―', '-'].includes(char)) {
                        ctx.save();
                        ctx.translate(currentX + 15, currentY + 15);
                        ctx.rotate(Math.PI / 2);
                        ctx.fillText(char, 0, 0);
                        ctx.restore();
                    } else {
                        ctx.fillText(char, currentX, currentY);
                    }
                    currentY += charHeight;
                }
            });

            // 4. 下部タイトルボックス（自動折り返し対応）
            const volNum = volNumInput.value || "";
            const volTitle = (volTitleInput.value || "").toUpperCase();

            const boxWidth = 480; 
            const maxTitleTextWidth = 360;
            
            ctx.font = '800 22px "Noto Serif JP", sans-serif';
            
            const words = volTitle.split(' ');
            let titleLines = [];
            let currentLine = '';

            words.forEach(word => {
                const testLine = currentLine ? currentLine + ' ' + word : word;
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxTitleTextWidth && currentLine) {
                    titleLines.push(currentLine);
                    currentLine = word;
                } else {
                    currentLine = testLine;
                }
            });
            if (currentLine) titleLines.push(currentLine);

            const titleLineHeight = 28;
            const computedHeight = Math.max(80, (titleLines.length * titleLineHeight) + 24);

            const boxX = (width - boxWidth) / 2;
            const boxY = height - computedHeight - 60;

            ctx.strokeStyle = textColor;
            ctx.lineWidth = 6;
            ctx.strokeRect(boxX, boxY, boxWidth, computedHeight);

            ctx.fillStyle = textColor;
            ctx.font = '900 32px "Noto Serif JP", sans-serif';
            ctx.textBaseline = 'middle';
            ctx.fillText(volNum, boxX + 20, boxY + (computedHeight / 2));

            ctx.font = '800 22px "Noto Serif JP", sans-serif';
            const titleStartX = boxX + 75;
            const startTitleY = boxY + (computedHeight - (titleLines.length * titleLineHeight)) / 2 + (titleLineHeight / 2);

            titleLines.forEach((tLine, index) => {
                ctx.fillText(tLine, titleStartX, startTitleY + (index * titleLineHeight));
            });

            if (callback) callback(canvas);
        }

        let overlayTimer = null;
        function updateOverlayImage() {
            clearTimeout(overlayTimer);
            overlayTimer = setTimeout(() => {
                renderCardToCanvas((canvas) => {
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
                    document.getElementById('longPressOverlay').src = dataUrl;
                });
            }, 100);
        }

        // JPEG画像ダウンロード
        function downloadImage() {
            renderCardToCanvas((canvas) => {
                const link = document.createElement('a');
                link.download = `bleach_poem_${Date.now()}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
            });
        }
    </script>
