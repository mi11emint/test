<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <title>BLEACH風 ポエムジェネレーター</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121214',
                        cardBg: '#1e1e24',
                        accentRed: '#ff2d55'
                    },
                    fontFamily: {
                        serif: ['"Shippori Mincho"', '"Noto Serif JP"', 'serif'],
                        sans: ['"Inter"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts for BLEACH-like typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        /* 縦書きモード指定 */
        .writing-vertical {
            writing-mode: vertical-rl;
            text-orientation: upright;
        }
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 3px;
        }
        /* スライダーカスタム */
        input[type=range] {
            accent-color: #ff2d55;
        }
    </style>
</head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen flex flex-col antialiased selection:bg-rose-500 selection:text-white pb-12">

    <!-- Header Area -->
    <header class="border-b border-zinc-800 bg-zinc-950/80 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="bg-accentRed text-white text-xs font-bold px-2.5 py-1 rounded-md tracking-wider">POEM</span>
                <div>
                    <h1 class="text-lg md:text-xl font-bold tracking-wider text-white flex items-center gap-2">
                        BLEACH <span class="text-xs font-normal text-zinc-400">風 ポエムジェネレーター</span>
                    </h1>
                </div>
            </div>

            <!-- 背景色切り替えトグル (ポエムカード出力用) -->
            <div class="bg-zinc-900 border border-zinc-700/80 p-1 rounded-xl flex items-center gap-1 shadow-inner">
                <button id="btnBgDark" onclick="setPreviewBg('dark')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-zinc-700 text-white shadow-sm">
                    <span class="w-2.5 h-2.5 rounded-full bg-black border border-zinc-500 inline-block"></span> 黒背景
                </button>
                <button id="btnBgLight" onclick="setPreviewBg('light')" class="px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-zinc-400 hover:text-white">
                    <span class="w-2.5 h-2.5 rounded-full bg-white inline-block"></span> 白背景
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 pt-6 flex-1 w-full flex flex-col gap-8">

        <!-- ③ プレビュー画面を上部に配置 -->
        <section class="w-full flex flex-col items-center gap-4 border-b border-zinc-800 pb-8">
            <div class="w-full flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <svg class="w-5 h-5 text-accentRed" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                    <h2 class="text-base font-bold text-white tracking-wide">リアルタイムプレビュー</h2>
                </div>
                <button onclick="downloadImage()" class="bg-accentRed hover:bg-rose-600 active:scale-95 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow-lg shadow-rose-950/50 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    画像を保存 (PNG)
                </button>
            </div>

            <!-- BLEACH巻頭風ポエムカード本体 (プレビュー) -->
            <div class="w-full flex justify-center overflow-x-auto py-2">
                <div id="poemCard" class="w-[360px] sm:w-[400px] min-h-[600px] bg-black text-white p-6 transition-colors duration-300 shadow-2xl rounded-sm flex flex-col justify-between border border-zinc-800 relative select-none">
                    
                    <!-- ① 横長モノクロ画像表示枠（細めに修正: h-16 sm:h-20） -->
                    <div id="imageDisplayBox" class="w-full h-16 sm:h-20 bg-zinc-900 relative overflow-hidden flex items-center justify-center border border-zinc-800/50">
                        <img id="previewImg" src="" alt="ポエム用画像" class="absolute max-w-none w-full hidden object-cover filter grayscale contrast-[1.3]">
                        <div id="imgPlaceholder" class="text-zinc-600 text-xs text-center px-4">
                            [ 画像未選択 - 下記からアップロード ]
                        </div>
                    </div>

                    <!-- 縦書きポエムテキスト領域 -->
                    <div class="my-6 flex-1 flex justify-center items-start min-h-[260px] py-2">
                        <div id="previewPoem" class="writing-vertical font-serif text-lg sm:text-xl tracking-[0.2em] leading-[2.2em] max-h-[340px] flex flex-row-reverse flex-wrap items-start whitespace-pre-wrap">
                        </div>
                    </div>

                    <!-- ② 巻数＆詩タイトル枠（横幅をスリムにし高さを拡大、単語での自動改行に対応） -->
                    <div class="pt-2 flex justify-center items-center">
                        <div id="previewTitleBorder" class="border-[3.5px] border-white px-3 py-2.5 flex items-center gap-2.5 font-extrabold tracking-wider max-w-[280px] sm:max-w-[310px] min-h-[64px]">
                            <span id="previewVolNum" class="text-lg sm:text-xl font-black leading-none shrink-0">1.</span>
                            <span id="previewVolTitle" class="text-xs sm:text-sm font-extrabold uppercase tracking-widest leading-snug break-words uppercase">THE DEATH AND THE STRAWBERRY</span>
                        </div>
                    </div>

                </div>
            </div>
        </section>

        <!-- 下部：デザイン・テキスト編集パネル -->
        <section class="w-full grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- 1. 横長画像設定 -->
            <div class="bg-cardBg/80 border border-zinc-800 rounded-2xl p-5 shadow-lg space-y-4">
                <h3 class="text-sm font-semibold text-zinc-300 flex items-center justify-between">
                    <span>1. 横長画像設定 <span class="text-xs text-zinc-500 font-normal">(自動モノクロ化)</span></span>
                </h3>

                <!-- アップロードエリア -->
                <div id="dropZone" onclick="document.getElementById('imageInput').click()" 
                     class="border-2 border-dashed border-zinc-700 hover:border-accentRed/70 bg-zinc-900/50 hover:bg-zinc-900 transition cursor-pointer rounded-xl p-4 text-center group flex flex-col items-center justify-center min-h-[90px]">
                    <svg class="w-6 h-6 text-zinc-500 group-hover:text-accentRed transition mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p class="text-xs text-zinc-400 group-hover:text-zinc-200">ファイルをドロップ または クリック</p>
                    <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                </div>

                <!-- スライダーコントロール群 -->
                <div class="space-y-3 pt-1">
                    <div>
                        <div class="flex justify-between text-xs text-zinc-400 mb-1">
                            <span>画像位置 (上下移動)</span>
                            <span id="posYVal">50%</span>
                        </div>
                        <input type="range" id="posY" min="0" max="100" value="50" class="w-full h-1.5 bg-zinc-700 rounded-lg appearance-none cursor-pointer" oninput="updateControls()">
                    </div>

                    <div>
                        <div class="flex justify-between text-xs text-zinc-400 mb-1">
                            <span>ズーム (拡大率)</span>
                            <span id="zoomVal">1.0x</span>
                        </div>
                        <input type="range" id="zoom" min="1" max="3" step="0.05" value="1" class="w-full h-1.5 bg-zinc-700 rounded-lg appearance-none cursor-pointer" oninput="updateControls()">
                    </div>

                    <div>
                        <div class="flex justify-between text-xs text-zinc-400 mb-1">
                            <span>コントラスト (白黒強弱)</span>
                            <span id="contrastVal">130%</span>
                        </div>
                        <input type="range" id="contrast" min="50" max="250" value="130" class="w-full h-1.5 bg-zinc-700 rounded-lg appearance-none cursor-pointer" oninput="updateControls()">
                    </div>
                </div>
            </div>

            <!-- 2. 詩 (ポエム) 本文 -->
            <div class="bg-cardBg/80 border border-zinc-800 rounded-2xl p-5 shadow-lg space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="text-sm font-semibold text-zinc-300">2. 詩 (ポエム) 本文</h3>
                    <button onclick="applySamplePoem()" class="text-xs text-accentRed hover:text-rose-400 underline transition">
                        サンプル適用
                    </button>
                </div>
                <textarea id="poemInput" rows="6" placeholder="ここに詩を入力（改行で縦列が変わります）"
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-3.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-accentRed transition leading-relaxed"
                    oninput="updateControls()"></textarea>
            </div>

            <!-- 3. 巻数数字 & 詩タイトル -->
            <div class="bg-cardBg/80 border border-zinc-800 rounded-2xl p-5 shadow-lg space-y-4">
                <h3 class="text-sm font-semibold text-zinc-300">3. 巻数数字 & 詩タイトル</h3>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">巻数数字</label>
                        <input type="text" id="volNumInput" value="1." placeholder="例: 1."
                            class="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2.5 text-sm text-zinc-100 focus:outline-none focus:border-accentRed"
                            oninput="updateControls()">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">詩タイトル (自動折り返し対応)</label>
                        <input type="text" id="volTitleInput" value="THE DEATH AND THE STRAWBERRY" placeholder="例: THE DEATH AND..."
                            class="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2.5 text-sm text-zinc-100 focus:outline-none focus:border-accentRed"
                            oninput="updateControls()">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Canvas (画像生成用非表示キャンバス) -->
    <canvas id="exportCanvas" class="hidden"></canvas>

    <!-- App Main Script -->
    <script>
        // App State
        let currentTheme = 'dark'; // 'dark' | 'light'
        let uploadedImage = null;

        // Default Sample Poem
        const defaultPoem = "僕たちは 伸ばす手に\n駆ける髪に\n背中に届く まぶしい光に\n似た何かを夢見ている";

        // DOM Elements
        const poemInput = document.getElementById('poemInput');
        const volNumInput = document.getElementById('volNumInput');
        const volTitleInput = document.getElementById('volTitleInput');
        
        const previewPoem = document.getElementById('previewPoem');
        const previewVolNum = document.getElementById('previewVolNum');
        const previewVolTitle = document.getElementById('previewVolTitle');
        const previewImg = document.getElementById('previewImg');
        const imgPlaceholder = document.getElementById('imgPlaceholder');
        const poemCard = document.getElementById('poemCard');
        const previewTitleBorder = document.getElementById('previewTitleBorder');

        // Initialize App
        window.onload = () => {
            poemInput.value = defaultPoem;
            updateControls();
            
            // Drag and drop setup
            const dropZone = document.getElementById('dropZone');
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('border-accentRed');
            });
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('border-accentRed');
            });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('border-accentRed');
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    loadImageFile(e.dataTransfer.files[0]);
                }
            });
        };

        // Handle Image Upload
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                loadImageFile(file);
            }
        }

        function loadImageFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedImage = new Image();
                uploadedImage.onload = () => {
                    previewImg.src = e.target.result;
                    previewImg.classList.remove('hidden');
                    imgPlaceholder.classList.add('hidden');
                    updateControls();
                };
                uploadedImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Apply Sample Poem
        function applySamplePoem() {
            poemInput.value = defaultPoem;
            volNumInput.value = "1.";
            volTitleInput.value = "THE DEATH AND THE STRAWBERRY";
            updateControls();
        }

        // Toggle Preview Theme (Dark/Light)
        function setPreviewBg(mode) {
            currentTheme = mode;
            const btnDark = document.getElementById('btnBgDark');
            const btnLight = document.getElementById('btnBgLight');

            if (mode === 'dark') {
                poemCard.style.backgroundColor = '#000000';
                poemCard.style.color = '#ffffff';
                previewTitleBorder.style.borderColor = '#ffffff';

                btnDark.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-zinc-700 text-white shadow-sm";
                btnLight.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-zinc-400 hover:text-white";
            } else {
                poemCard.style.backgroundColor = '#ffffff';
                poemCard.style.color = '#000000';
                previewTitleBorder.style.borderColor = '#000000';

                btnLight.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-zinc-200 text-zinc-900 font-bold shadow-sm";
                btnDark.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-zinc-400 hover:text-white";
            }
        }

        // Realtime update preview elements and image transforms
        function updateControls() {
            // Slider Values
            const posY = document.getElementById('posY').value;
            const zoom = document.getElementById('zoom').value;
            const contrast = document.getElementById('contrast').value;

            document.getElementById('posYVal').innerText = `${posY}%`;
            document.getElementById('zoomVal').innerText = `${zoom}x`;
            document.getElementById('contrastVal').innerText = `${contrast}%`;

            // Image Styling
            if (uploadedImage) {
                previewImg.style.transform = `scale(${zoom})`;
                previewImg.style.objectPosition = `center ${posY}%`;
                previewImg.style.filter = `grayscale(100%) contrast(${contrast}%)`;
            }

            // Text Updating
            previewPoem.innerText = poemInput.value || " ";
            previewVolNum.innerText = volNumInput.value || "";
            previewVolTitle.innerText = volTitleInput.value || "";
        }

        // Download HTML Card as High Quality PNG using HTML5 Canvas
        function downloadImage() {
            const canvas = document.getElementById('exportCanvas');
            const ctx = canvas.getContext('2d');

            // High-res canvas dimensions
            const width = 800;
            const height = 1200;
            canvas.width = width;
            canvas.height = height;

            const isDark = currentTheme === 'dark';
            const bgColor = isDark ? '#000000' : '#ffffff';
            const textColor = isDark ? '#ffffff' : '#000000';

            // 1. Fill Background
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, width, height);

            // 2. Render Image Area (① 細めの横長形状 h=140px)
            const imgBoxX = 60;
            const imgBoxY = 60;
            const imgBoxWidth = width - 120;
            const imgBoxHeight = 140;

            if (uploadedImage) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(imgBoxX, imgBoxY, imgBoxWidth, imgBoxHeight);
                ctx.clip();

                const contrast = document.getElementById('contrast').value;
                ctx.filter = `grayscale(100%) contrast(${contrast}%)`;

                const zoom = parseFloat(document.getElementById('zoom').value);
                const posY = parseFloat(document.getElementById('posY').value) / 100;

                const renderW = imgBoxWidth * zoom;
                const renderH = (uploadedImage.height * (imgBoxWidth / uploadedImage.width)) * zoom;

                const drawX = imgBoxX + (imgBoxWidth - renderW) / 2;
                const drawY = imgBoxY + (imgBoxHeight - renderH) * posY;

                ctx.drawImage(uploadedImage, drawX, drawY, renderW, renderH);
                ctx.restore();
            } else {
                ctx.strokeStyle = isDark ? '#333333' : '#cccccc';
                ctx.lineWidth = 2;
                ctx.strokeRect(imgBoxX, imgBoxY, imgBoxWidth, imgBoxHeight);
            }

            // 3. Render Vertical Poem Text
            ctx.fillStyle = textColor;
            ctx.font = '700 34px "Shippori Mincho", "Noto Serif JP", serif';
            ctx.textBaseline = 'top';

            const lines = poemInput.value.split('\n');
            const lineSpacing = 65;
            const startX = width - 120;
            const startY = 260;

            lines.forEach((line, lineIndex) => {
                const currentX = startX - (lineIndex * lineSpacing);
                let currentY = startY;

                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (['、', '。'].includes(char)) {
                        ctx.fillText(char, currentX + 15, currentY - 15);
                    } else if (['ー', '―', '-'].includes(char)) {
                        ctx.save();
                        ctx.translate(currentX + 15, currentY + 15);
                        ctx.rotate(Math.PI / 2);
                        ctx.fillText(char, 0, 0);
                        ctx.restore();
                    } else {
                        ctx.fillText(char, currentX, currentY);
                    }
                    currentY += 42;
                }
            });

            // 4. Render Bottom Title Box (② 横幅スリム＆高さを増やし、複数行自動折り返し対応)
            const volNum = volNumInput.value || "";
            const volTitle = (volTitleInput.value || "").toUpperCase();

            // 固定スリム幅と可変高さを設定
            const boxWidth = 480; 
            const maxTitleTextWidth = 360; // タイトル用領域幅
            
            ctx.font = '800 22px "Noto Serif JP", sans-serif';
            
            // 単語単位での折り返し計算
            const words = volTitle.split(' ');
            let titleLines = [];
            let currentLine = '';

            words.forEach(word => {
                const testLine = currentLine ? currentLine + ' ' + word : word;
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxTitleTextWidth && currentLine) {
                    titleLines.push(currentLine);
                    currentLine = word;
                } else {
                    currentLine = testLine;
                }
            });
            if (currentLine) titleLines.push(currentLine);

            const titleLineHeight = 28;
            const computedHeight = Math.max(80, (titleLines.length * titleLineHeight) + 24);

            const boxX = (width - boxWidth) / 2;
            const boxY = height - computedHeight - 60;

            // 枠の描画
            ctx.strokeStyle = textColor;
            ctx.lineWidth = 6;
            ctx.strokeRect(boxX, boxY, boxWidth, computedHeight);

            // 巻数の描画
            ctx.fillStyle = textColor;
            ctx.font = '900 32px "Noto Serif JP", sans-serif';
            ctx.textBaseline = 'middle';
            ctx.fillText(volNum, boxX + 20, boxY + (computedHeight / 2));

            // タイトルの描画（複数行対応）
            ctx.font = '800 22px "Noto Serif JP", sans-serif';
            const titleStartX = boxX + 75;
            const startTitleY = boxY + (computedHeight - (titleLines.length * titleLineHeight)) / 2 + (titleLineHeight / 2);

            titleLines.forEach((tLine, index) => {
                ctx.fillText(tLine, titleStartX, startTitleY + (index * titleLineHeight));
            });

            // 5. Trigger Image Download
            const link = document.createElement('a');
            link.download = `bleach_poem_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
