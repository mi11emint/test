<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLEACH風 ポエムジェネレーター</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121214',
                        cardBg: '#1e1e24',
                        accentRed: '#e50914'
                    },
                    fontFamily: {
                        serif: ['"Shippori Mincho"', '"Noto Serif JP"', 'serif'],
                        sans: ['"Inter"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts for BLEACH-like typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        /* 縦書きモード指定 */
        .writing-vertical {
            writing-mode: vertical-rl;
            text-orientation: upright;
        }
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 3px;
        }
        /* ポエムカードのスマホフィット */
        .poem-card-container {
            width: 100%;
            max-width: 380px;
            aspect-ratio: 1 / 1.5;
        }
        /* アスペクト比 6:1 */
        .aspect-crop-box {
            aspect-ratio: 6 / 1;
        }
    </style>
</head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen flex flex-col antialiased selection:bg-rose-500 selection:text-white pb-6">

    <!-- Header Area -->
    <header class="border-b border-zinc-800 bg-zinc-950/90 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-3 py-2 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="bg-accentRed text-white text-[10px] sm:text-xs font-bold px-2 py-0.5 rounded tracking-wider">POEM</span>
                <h1 class="text-base sm:text-lg font-bold tracking-wider text-white flex items-center gap-1.5">
                    BLEACH <span class="text-[10px] sm:text-xs font-normal text-zinc-400">ジェネレーター</span>
                </h1>
            </div>

            <!-- 背景色切り替えトグル (ポエムカード出力用) -->
            <div class="bg-zinc-900 border border-zinc-700/80 p-0.5 rounded-lg flex items-center gap-1 shadow-inner">
                <button id="btnBgDark" onclick="setPreviewBg('dark')" class="px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 text-zinc-400 hover:text-white min-h-[32px]">
                    <span class="w-2 h-2 rounded-full bg-black border border-zinc-500 inline-block"></span> 黒
                </button>
                <button id="btnBgLight" onclick="setPreviewBg('light')" class="px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 bg-zinc-200 text-zinc-900 font-bold shadow-sm min-h-[32px]">
                    <span class="w-2 h-2 rounded-full bg-white inline-block"></span> 白
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-3 pt-2 flex-1 w-full flex flex-col gap-4">

        <!-- リアルタイムプレビュー画面 -->
        <section class="w-full flex flex-col items-center gap-2 border-b border-zinc-800/80 pb-3 pt-1">
            <div class="w-full max-w-[380px] flex items-center justify-between px-1">
                <div class="flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-accentRed" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                    <h2 class="text-xs sm:text-sm font-bold text-white tracking-wide">リアルタイムプレビュー</h2>
                </div>
                <button onclick="downloadImage()" class="bg-accentRed hover:bg-rose-600 active:scale-95 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition shadow-lg shadow-rose-950/50 flex items-center gap-1.5 min-h-[36px]">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    保存 (JPEG)
                </button>
            </div>

            <!-- BLEACH巻頭風ポエムカード本体 (プレビュー) -->
            <div class="w-full flex justify-center py-1">
                <div id="poemCard" class="poem-card-container bg-white text-black p-4 sm:p-5 transition-colors duration-300 shadow-2xl rounded-sm flex flex-col justify-between border border-zinc-800 relative select-none">
                    
                    <!-- ① 横長モノクロ画像表示枠（プレビュー用アスペクト比 6:1） -->
                    <div id="imageDisplayBox" onclick="handleImageDisplayClick()" class="w-full aspect-crop-box bg-zinc-900 relative overflow-hidden flex items-center justify-center border border-zinc-800/50 cursor-pointer group z-0">
                        <img id="previewImg" src="" alt="ポエム用画像" class="absolute inset-0 w-full h-full object-cover hidden pointer-events-none transition-all">
                        <div id="imgPlaceholder" class="text-zinc-400 text-[11px] text-center px-2 flex items-center gap-1 group-hover:text-zinc-200">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            タップして画像を選択・編集
                        </div>
                    </div>

                    <!-- 縦書きポエムテキスト領域 -->
                    <div class="my-1.5 flex-1 flex justify-center items-center min-h-[170px] py-1 overflow-hidden">
                        <div id="previewPoem" class="writing-vertical font-serif tracking-[0.2em] leading-[2em] max-h-[250px] flex flex-row-reverse flex-wrap items-center justify-center whitespace-pre-wrap">
                        </div>
                    </div>

                    <!-- ② 巻数＆詩タイトル枠 ＆ 作者名枠 -->
                    <div class="pt-0.5 flex flex-col items-center gap-1.5">
                        <div id="previewTitleBorder" class="border-[3px] border-black px-2.5 py-1 flex items-center gap-2 font-extrabold tracking-wider max-w-[260px] sm:max-w-[290px] min-h-[48px]">
                            <span id="previewVolNum" class="font-black leading-none shrink-0">1.</span>
                            <span id="previewVolTitle" class="font-extrabold uppercase tracking-widest leading-tight break-words whitespace-pre-line">THE DEATH AND THE STRAWBERRY</span>
                        </div>
                        
                        <!-- 下部の作者名枠（固定表示: BLEACH POEM MAKER） -->
                        <div id="previewAuthorBorder" class="border-[3px] border-black px-2 py-0.5 flex items-center justify-center font-extrabold tracking-widest max-w-[130px] sm:max-w-[145px] min-h-[26px]">
                            <span id="previewAuthor" class="font-bold uppercase tracking-wider text-center leading-tight break-words">BLEACH POEM MAKER</span>
                        </div>
                    </div>

                    <!-- 長押し保存用リアルタイムオーバーレイ画像 -->
                    <img id="longPressOverlay" alt="Long press to save" class="absolute inset-0 w-full h-full opacity-0 z-10 cursor-pointer pointer-events-auto" title="長押しまたは右クリックで画像を保存">
                </div>
            </div>
            <p class="text-[10px] text-zinc-500 text-center">※ プレビュー画像を長押し / 右クリックで直接保存も可能です</p>
        </section>

        <!-- 非表示画像インプット -->
        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">

        <!-- 下部：2カラム編集パネル -->
        <section class="w-full grid grid-cols-1 md:grid-cols-2 gap-3 max-w-4xl mx-auto">
            
            <!-- 1. 詩 (ポエム) 本文 ＆ フォントサイズ -->
            <div class="bg-cardBg/90 border border-zinc-800 rounded-xl p-3 shadow-lg flex flex-col space-y-2">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-semibold text-zinc-300">1. 詩本文</h3>
                    <button onclick="applySamplePoem()" class="text-[11px] text-accentRed hover:text-rose-400 underline transition">
                        サンプル適用
                    </button>
                </div>
                <textarea id="poemInput" rows="4" placeholder="ここに詩を入力（改行で列変更）"
                    class="w-full flex-1 bg-zinc-900 border border-zinc-700 rounded-lg p-2 text-xs text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-accentRed transition leading-relaxed resize-none min-h-[85px]"
                    oninput="updateControls()"></textarea>

                <div class="pt-1.5 border-t border-zinc-800 flex items-center justify-between">
                    <label class="text-[10px] text-zinc-400">詩のフォントサイズ</label>
                    <select id="poemFontSize" class="bg-zinc-900 border border-zinc-700 rounded text-xs text-zinc-200 px-2 py-1 focus:outline-none focus:border-accentRed" onchange="updateControls()">
                        <option value="14">小 (14px)</option>
                        <option value="16" selected>標準 (16px)</option>
                        <option value="18">大 (18px)</option>
                        <option value="20">特大 (20px)</option>
                    </select>
                </div>
            </div>

            <!-- 2. 巻数 & 詩タイトル（自由改行可）＆ サイズ調整 -->
            <div class="bg-cardBg/90 border border-zinc-800 rounded-xl p-3 shadow-lg flex flex-col justify-between space-y-2">
                <h3 class="text-xs font-semibold text-zinc-300">2. 巻数＆詩タイトル</h3>
                <div class="space-y-2">
                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-0.5">巻数・名前（例: KOJI 1. / 1.）</label>
                        <input type="text" id="volNumInput" value="1." placeholder="例: KOJI 1. または 1."
                            class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-2 py-1 text-xs text-zinc-100 focus:outline-none focus:border-accentRed min-h-[32px]"
                            oninput="updateControls()">
                    </div>

                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-0.5">詩タイトル（改行可）</label>
                        <textarea id="volTitleInput" rows="2" placeholder="例: THE DEATH AND&#10;THE STRAWBERRY"
                            class="w-full bg-zinc-900 border border-zinc-700 rounded-lg px-2 py-1 text-xs text-zinc-100 focus:outline-none focus:border-accentRed resize-none"
                            oninput="updateControls()">THE DEATH AND THE STRAWBERRY</textarea>
                    </div>

                    <div class="pt-1.5 border-t border-zinc-800 grid grid-cols-3 gap-1.5">
                        <div class="flex flex-col gap-0.5">
                            <label class="text-[9px] text-zinc-400">巻数サイズ</label>
                            <select id="volNumFontSize" class="bg-zinc-900 border border-zinc-700 rounded text-[11px] text-zinc-200 px-1 py-1 focus:outline-none focus:border-accentRed" onchange="updateControls()">
                                <option value="14">小 (14px)</option>
                                <option value="18" selected>標準 (18px)</option>
                                <option value="22">大 (22px)</option>
                                <option value="28">特大 (28px)</option>
                            </select>
                        </div>
                        <div class="flex flex-col gap-0.5">
                            <label class="text-[9px] text-zinc-400">タイトルサイズ</label>
                            <select id="titleFontSize" class="bg-zinc-900 border border-zinc-700 rounded text-[11px] text-zinc-200 px-1 py-1 focus:outline-none focus:border-accentRed" onchange="updateControls()">
                                <option value="10">小 (10px)</option>
                                <option value="12" selected>標準 (12px)</option>
                                <option value="14">大 (14px)</option>
                                <option value="16">特大 (16px)</option>
                            </select>
                        </div>
                        <div class="flex flex-col gap-0.5">
                            <label class="text-[9px] text-zinc-400">作者名サイズ</label>
                            <select id="authorFontSize" class="bg-zinc-900 border border-zinc-700 rounded text-[11px] text-zinc-200 px-1 py-1 focus:outline-none focus:border-accentRed" onchange="updateControls()">
                                <option value="8">小 (8px)</option>
                                <option value="10" selected>標準 (10px)</option>
                                <option value="12">大 (12px)</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 画像トリミングモーダル（編集窓自体がプレビューと同じ 6:1 の横長枠） -->
    <div id="cropModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-2 select-none">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-lg rounded-2xl p-3 sm:p-4 flex flex-col gap-2 shadow-2xl max-h-[95vh] overflow-y-auto">
            
            <!-- 上部ヘッダー ＆ 操作ボタン -->
            <div class="flex flex-col gap-2 border-b border-zinc-800 pb-2.5">
                <div class="flex items-center justify-between">
                    <h3 class="text-xs sm:text-sm font-bold text-white flex items-center gap-1.5">
                        <svg class="w-4 h-4 text-accentRed" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        画像の切り抜き＆位置調整
                    </h3>
                    <button onclick="closeCropModal()" class="text-zinc-400 hover:text-white p-1">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>

                <div class="flex gap-2">
                    <button onclick="document.getElementById('imageInput').click()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition min-h-[34px]">
                        別の画像を選択
                    </button>
                    <button onclick="applyCrop()" class="flex-1 bg-accentRed hover:bg-rose-600 text-white text-xs font-bold py-1.5 rounded-lg transition min-h-[34px] shadow-lg shadow-rose-950/50 flex items-center justify-center gap-1">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        切り抜きを適用
                    </button>
                </div>
            </div>

            <p class="text-[10px] text-zinc-400 text-center">窓内をドラッグして移動 / ホイール・ピンチで拡大縮小</p>

            <!-- プレビューと同じ 6:1 比率の切り抜きビューポート -->
            <div id="cropViewport" class="w-full aspect-crop-box bg-black relative overflow-hidden border-2 border-accentRed/90 rounded touch-none cursor-grab active:cursor-grabbing flex items-center justify-center">
                <img id="cropImg" src="" alt="Crop target" class="absolute max-w-none pointer-events-none select-none origin-top-left filter grayscale contrast-[1.2]">
            </div>
        </div>
    </div>

    <!-- Canvas (画像生成用非表示キャンバス) -->
    <canvas id="exportCanvas" class="hidden"></canvas>

    <!-- App Main Script -->
    <script>
        // App State
        let currentTheme = 'light';
        let rawImageObj = null;
        let croppedDataUrl = null;

        const CROP_ASPECT = 6 / 1;
        let cropState = { x: 0, y: 0, scale: 1, baseW: 0, baseH: 0 };

        const defaultPoem = "僕たちは 伸ばす手に\n駆ける髪に\n背中に届く まぶしい光に\n似た何かを夢見ている";

        // DOM Elements
        const poemInput = document.getElementById('poemInput');
        const volNumInput = document.getElementById('volNumInput');
        const volTitleInput = document.getElementById('volTitleInput');
        
        const poemFontSize = document.getElementById('poemFontSize');
        const volNumFontSize = document.getElementById('volNumFontSize');
        const titleFontSize = document.getElementById('titleFontSize');
        const authorFontSize = document.getElementById('authorFontSize');

        const previewPoem = document.getElementById('previewPoem');
        const previewVolNum = document.getElementById('previewVolNum');
        const previewVolTitle = document.getElementById('previewVolTitle');
        const previewAuthor = document.getElementById('previewAuthor');
        
        const previewImg = document.getElementById('previewImg');
        const imgPlaceholder = document.getElementById('imgPlaceholder');
        const poemCard = document.getElementById('poemCard');
        const previewTitleBorder = document.getElementById('previewTitleBorder');
        const previewAuthorBorder = document.getElementById('previewAuthorBorder');
        const imageDisplayBox = document.getElementById('imageDisplayBox');

        const cropModal = document.getElementById('cropModal');
        const cropViewport = document.getElementById('cropViewport');
        const cropImg = document.getElementById('cropImg');

        window.onload = () => {
            poemInput.value = defaultPoem;
            setPreviewBg('light');
            updateControls();
            setupCropInteractions();
            setupOverlayPointerEvents();
        };

        function handleImageDisplayClick() {
            if (!rawImageObj) {
                document.getElementById('imageInput').click();
            } else {
                openCropModal();
            }
        }

        function openCropModal() {
            if (!rawImageObj) return;
            cropModal.classList.remove('hidden');
            setTimeout(initCropTransform, 50);
        }

        function closeCropModal() {
            cropModal.classList.add('hidden');
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                loadImageFile(file);
            }
        }

        function loadImageFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    rawImageObj = img;
                    cropImg.src = e.target.result;
                    openCropModal();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // トリミングビューポート内での初期配置とスケール計算
        function initCropTransform() {
            if (!rawImageObj) return;
            const vw = cropViewport.clientWidth;
            const vh = cropViewport.clientHeight;
            if (!vw || !vh) return;

            const scaleX = vw / rawImageObj.width;
            const scaleY = vh / rawImageObj.height;
            const baseCoverScale = Math.max(scaleX, scaleY);

            cropState.baseW = rawImageObj.width * baseCoverScale;
            cropState.baseH = rawImageObj.height * baseCoverScale;
            cropState.scale = 1;
            cropState.x = (vw - cropState.baseW) / 2;
            cropState.y = (vh - cropState.baseH) / 2;

            clampCropPosition();
            renderCropModalImage();
        }

        function clampCropPosition() {
            const vw = cropViewport.clientWidth;
            const vh = cropViewport.clientHeight;
            const currentW = cropState.baseW * cropState.scale;
            const currentH = cropState.baseH * cropState.scale;

            const minX = vw - currentW;
            const maxX = 0;
            const minY = vh - currentH;
            const maxY = 0;

            cropState.x = Math.min(maxX, Math.max(minX, cropState.x));
            cropState.y = Math.min(maxY, Math.max(minY, cropState.y));
        }

        function renderCropModalImage() {
            if (!rawImageObj) return;
            const currentW = cropState.baseW * cropState.scale;
            const currentH = cropState.baseH * cropState.scale;

            cropImg.style.width = `${currentW}px`;
            cropImg.style.height = `${currentH}px`;
            cropImg.style.transform = `translate3d(${cropState.x}px, ${cropState.y}px, 0px)`;
        }

        // ドラッグ移動・ピンチ＆ホイールズーム操作
        function setupCropInteractions() {
            let isDragging = false;
            let startX = 0, startY = 0;
            let initialCropX = 0, initialCropY = 0;
            let initialPinchDist = 0;
            let startScale = 1;

            const getTouchDist = (e) => {
                return Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            };

            const onStart = (clientX, clientY) => {
                isDragging = true;
                startX = clientX;
                startY = clientY;
                initialCropX = cropState.x;
                initialCropY = cropState.y;
            };

            const onMove = (clientX, clientY) => {
                if (!isDragging) return;
                const dx = clientX - startX;
                const dy = clientY - startY;
                cropState.x = initialCropX + dx;
                cropState.y = initialCropY + dy;
                clampCropPosition();
                renderCropModalImage();
            };

            const onEnd = () => { isDragging = false; };

            cropViewport.addEventListener('mousedown', (e) => onStart(e.clientX, e.clientY));
            window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', onEnd);

            cropViewport.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    onStart(e.touches[0].clientX, e.touches[0].clientY);
                } else if (e.touches.length === 2) {
                    isDragging = false;
                    initialPinchDist = getTouchDist(e);
                    startScale = cropState.scale;
                }
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length === 1) {
                    onMove(e.touches[0].clientX, e.touches[0].clientY);
                } else if (e.touches.length === 2 && initialPinchDist > 0) {
                    const dist = getTouchDist(e);
                    const factor = dist / initialPinchDist;
                    cropState.scale = Math.max(1, Math.min(3.5, startScale * factor));
                    clampCropPosition();
                    renderCropModalImage();
                }
            }, { passive: true });

            window.addEventListener('touchend', onEnd);

            cropViewport.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY < 0 ? 0.08 : -0.08;
                cropState.scale = Math.max(1, Math.min(3.5, cropState.scale + delta));
                clampCropPosition();
                renderCropModalImage();
            }, { passive: false });
        }

        // トリミング適用（窓の中に見えている状態をそのまま高解像度画像として生成）
        function applyCrop() {
            if (!rawImageObj) return;

            const vw = cropViewport.clientWidth || 300;
            const vh = cropViewport.clientHeight || 50;

            const outW = 800;
            const outH = 800 / CROP_ASPECT;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = outW;
            tempCanvas.height = outH;
            const tempCtx = tempCanvas.getContext('2d');

            // 窓枠に対する元画像の切り抜き座標を算出
            const scaleX = vw / rawImageObj.width;
            const scaleY = vh / rawImageObj.height;
            const baseCoverScale = Math.max(scaleX, scaleY);
            const actualScale = baseCoverScale * cropState.scale;

            const srcX = -cropState.x / actualScale;
            const srcY = -cropState.y / actualScale;
            const srcW = vw / actualScale;
            const srcH = vh / actualScale;

            tempCtx.filter = 'grayscale(100%) contrast(120%)';
            tempCtx.drawImage(rawImageObj, srcX, srcY, srcW, srcH, 0, 0, outW, outH);

            croppedDataUrl = tempCanvas.toDataURL('image/png');

            previewImg.src = croppedDataUrl;
            previewImg.classList.remove('hidden');
            imgPlaceholder.classList.add('hidden');

            closeCropModal();
            updateControls();
        }

        function applySamplePoem() {
            poemInput.value = defaultPoem;
            volNumInput.value = "1.";
            volTitleInput.value = "THE DEATH AND THE STRAWBERRY";
            updateControls();
        }

        function setPreviewBg(mode) {
            currentTheme = mode;
            const btnDark = document.getElementById('btnBgDark');
            const btnLight = document.getElementById('btnBgLight');

            if (mode === 'dark') {
                poemCard.style.backgroundColor = '#000000';
                poemCard.style.color = '#ffffff';
                previewTitleBorder.style.borderColor = '#ffffff';
                previewAuthorBorder.style.borderColor = '#ffffff';

                btnDark.className = "px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 bg-zinc-700 text-white shadow-sm min-h-[32px]";
                btnLight.className = "px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 text-zinc-400 hover:text-white min-h-[32px]";
            } else {
                poemCard.style.backgroundColor = '#ffffff';
                poemCard.style.color = '#000000';
                previewTitleBorder.style.borderColor = '#000000';
                previewAuthorBorder.style.borderColor = '#000000';

                btnLight.className = "px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 bg-zinc-200 text-zinc-900 font-bold shadow-sm min-h-[32px]";
                btnDark.className = "px-2.5 py-1 rounded-md text-xs font-bold transition flex items-center gap-1 text-zinc-400 hover:text-white min-h-[32px]";
            }
            updateControls();
        }

        function updateControls() {
            previewPoem.innerText = poemInput.value || " ";
            previewVolNum.innerText = volNumInput.value || "";
            previewVolTitle.innerText = volTitleInput.value || "";
            previewAuthor.innerText = "BLEACH POEM MAKER";

            // フォントサイズ更新
            previewPoem.style.fontSize = `${poemFontSize.value}px`;
            previewVolNum.style.fontSize = `${volNumFontSize.value}px`;
            previewVolTitle.style.fontSize = `${titleFontSize.value}px`;
            previewAuthor.style.fontSize = `${authorFontSize.value}px`;

            updateOverlayImage();
        }

        function setupOverlayPointerEvents() {
            const overlay = document.getElementById('longPressOverlay');
            overlay.addEventListener('click', (e) => {
                const rect = imageDisplayBox.getBoundingClientRect();
                if (
                    e.clientX >= rect.left &&
                    e.clientX <= rect.right &&
                    e.clientY >= rect.top &&
                    e.clientY <= rect.bottom
                ) {
                    handleImageDisplayClick();
                }
            });
        }

        // Canvas描画ロジック（プレビューと100%完全に一致）
        function renderCardToCanvas(callback) {
            const canvas = document.getElementById('exportCanvas');
            const ctx = canvas.getContext('2d');

            const width = 800;
            const height = 1200;
            canvas.width = width;
            canvas.height = height;

            const isDark = currentTheme === 'dark';
            const bgColor = isDark ? '#000000' : '#ffffff';
            const textColor = isDark ? '#ffffff' : '#000000';

            // 1. 背景色
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, width, height);

            // 2. 画像描画（アスペクト比 6:1）
            const imgBoxX = 60;
            const imgBoxY = 60;
            const imgBoxWidth = width - 120;
            const imgBoxHeight = imgBoxWidth / CROP_ASPECT;

            if (croppedDataUrl) {
                const croppedImg = new Image();
                croppedImg.onload = () => {
                    ctx.drawImage(croppedImg, imgBoxX, imgBoxY, imgBoxWidth, imgBoxHeight);
                    renderTextAndTitle(ctx, width, height, textColor);
                    if (callback) callback(canvas);
                };
                croppedImg.src = croppedDataUrl;
            } else {
                ctx.strokeStyle = isDark ? '#333333' : '#cccccc';
                ctx.lineWidth = 2;
                ctx.strokeRect(imgBoxX, imgBoxY, imgBoxWidth, imgBoxHeight);
                renderTextAndTitle(ctx, width, height, textColor);
                if (callback) callback(canvas);
            }
        }

        function renderTextAndTitle(ctx, width, height, textColor) {
            ctx.fillStyle = textColor;
            
            // 3. 縦書きポエムテキスト
            const pSize = Math.round(parseInt(poemFontSize.value) * 2.1);
            ctx.font = `700 ${pSize}px "Shippori Mincho", "Noto Serif JP", serif`;
            ctx.textBaseline = 'top';

            const lines = (poemInput.value || " ").split('\n');
            const lineSpacing = pSize * 1.7;
            const charHeight = pSize * 1.2;

            const totalPoemWidth = (lines.length - 1) * lineSpacing;
            const startX = (width / 2) + (totalPoemWidth / 2);
            const startY = 240;

            lines.forEach((line, lineIndex) => {
                const currentX = startX - (lineIndex * lineSpacing);
                let currentY = startY;

                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (['、', '。'].includes(char)) {
                        ctx.fillText(char, currentX + 15, currentY - 15);
                    } else if (['ー', '―', '-'].includes(char)) {
                        ctx.save();
                        ctx.translate(currentX + 15, currentY + 15);
                        ctx.rotate(Math.PI / 2);
                        ctx.fillText(char, 0, 0);
                        ctx.restore();
                    } else {
                        ctx.fillText(char, currentX, currentY);
                    }
                    currentY += charHeight;
                }
            });

            // 4. 下部タイトルボックス（手動改行および自動折り返し対応）
            const volNum = volNumInput.value || "";
            const volTitleRaw = (volTitleInput.value || "").toUpperCase();
            const author = "BLEACH POEM MAKER";

            const boxWidth = 480; 
            const maxTitleTextWidth = 350;
            
            const vnSize = Math.round(parseInt(volNumFontSize.value) * 1.9);
            const tSize = Math.round(parseInt(titleFontSize.value) * 1.9);
            
            ctx.font = `800 ${tSize}px "Noto Serif JP", sans-serif`;
            
            const rawTitleLines = volTitleRaw.split('\n');
            let titleLines = [];

            rawTitleLines.forEach(rawLine => {
                const words = rawLine.split(' ');
                let currentLine = '';

                words.forEach(word => {
                    const testLine = currentLine ? currentLine + ' ' + word : word;
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxTitleTextWidth && currentLine) {
                        titleLines.push(currentLine);
                        currentLine = word;
                    } else {
                        currentLine = testLine;
                    }
                });
                if (currentLine) titleLines.push(currentLine);
            });

            const titleLineHeight = tSize * 1.35;
            const computedHeight = Math.max(80, (titleLines.length * titleLineHeight) + 20);

            const boxX = (width - boxWidth) / 2;
            const boxY = height - computedHeight - 110;

            // 巻数・タイトル枠描画
            ctx.strokeStyle = textColor;
            ctx.lineWidth = 6;
            ctx.strokeRect(boxX, boxY, boxWidth, computedHeight);

            // 巻数数字を描画
            ctx.fillStyle = textColor;
            ctx.font = `900 ${vnSize}px "Noto Serif JP", sans-serif`;
            ctx.textBaseline = 'middle';
            ctx.fillText(volNum, boxX + 20, boxY + (computedHeight / 2));

            // タイトルテキストを描画
            ctx.font = `800 ${tSize}px "Noto Serif JP", sans-serif`;
            const titleStartX = boxX + (volNum ? 110 : 25);
            const startTitleY = boxY + (computedHeight - (titleLines.length * titleLineHeight)) / 2 + (titleLineHeight / 2);

            titleLines.forEach((tLine, index) => {
                ctx.fillText(tLine, titleStartX, startTitleY + (index * titleLineHeight));
            });

            // 5. 作者名枠（隙間28px）
            const authorBoxWidth = 240;
            const aSize = Math.round(parseInt(authorFontSize.value) * 1.9);
            const authorBoxHeight = aSize + 20;
            const authorBoxX = (width - authorBoxWidth) / 2;
            const authorBoxY = boxY + computedHeight + 28;

            ctx.strokeStyle = textColor;
            ctx.lineWidth = 6;
            ctx.strokeRect(authorBoxX, authorBoxY, authorBoxWidth, authorBoxHeight);

            ctx.font = `800 ${aSize}px "Noto Serif JP", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(author, width / 2, authorBoxY + (authorBoxHeight / 2));
            ctx.textAlign = 'left'; // reset
        }

        let overlayTimer = null;
        function updateOverlayImage() {
            clearTimeout(overlayTimer);
            overlayTimer = setTimeout(() => {
                renderCardToCanvas((canvas) => {
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
                    document.getElementById('longPressOverlay').src = dataUrl;
                });
            }, 100);
        }

        // JPEG画像ダウンロード
        function downloadImage() {
            renderCardToCanvas((canvas) => {
                const link = document.createElement('a');
                link.download = `bleach_poem_${Date.now()}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
            });
        }
    </script>
