<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLEACH風 ポエムジェネレーター</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121214',
                        cardBg: '#1e1e24',
                        accentRed: '#ff2d55'
                    },
                    fontFamily: {
                        serif: ['"Shippori Mincho"', '"Noto Serif JP"', 'serif'],
                        sans: ['"Inter"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts for BLEACH-like typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
    <!-- html2canvas for precise rendering & font preservation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* 縦書きモード指定 */
        .writing-vertical {
            writing-mode: vertical-rl;
            text-orientation: upright;
        }
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #18181b;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 3px;
        }
        /* スライダーカスタム (スマホ用にタップ領域拡張) */
        input[type=range] {
            accent-color: #ff2d55;
            height: 28px;
        }
        input[type=range]::-webkit-slider-thumb {
            width: 22px;
            height: 22px;
        }
        /* ポエムカードのスマホフィット */
        .poem-card-container {
            width: 100%;
            max-width: 380px;
            aspect-ratio: 1 / 1.5;
        }
    </style>
</head>
<body class="bg-darkBg text-gray-200 font-sans min-h-screen flex flex-col antialiased selection:bg-rose-500 selection:text-white pb-12">

    <!-- Header Area -->
    <header class="border-b border-zinc-800 bg-zinc-950/90 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-3 py-2.5 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="bg-accentRed text-white text-[10px] sm:text-xs font-bold px-2 py-0.5 rounded tracking-wider">POEM</span>
                <h1 class="text-base sm:text-lg font-bold tracking-wider text-white flex items-center gap-1.5">
                    BLEACH <span class="text-[10px] sm:text-xs font-normal text-zinc-400">ジェネレーター</span>
                </h1>
            </div>

            <!-- 背景色切り替えトグル (ポエムカード出力用) -->
            <div class="bg-zinc-900 border border-zinc-700/80 p-0.5 rounded-lg flex items-center gap-1 shadow-inner">
                <button id="btnBgDark" onclick="setPreviewBg('dark')" class="px-2.5 py-1.5 rounded-md text-xs font-bold transition flex items-center gap-1 bg-zinc-700 text-white shadow-sm min-h-[36px]">
                    <span class="w-2 h-2 rounded-full bg-black border border-zinc-500 inline-block"></span> 黒
                </button>
                <button id="btnBgLight" onclick="setPreviewBg('light')" class="px-2.5 py-1.5 rounded-md text-xs font-bold transition flex items-center gap-1 text-zinc-400 hover:text-white min-h-[36px]">
                    <span class="w-2 h-2 rounded-full bg-white inline-block"></span> 白
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-3 pt-3 flex-1 w-full flex flex-col gap-6">

        <!-- ③ プレビュー画面を上部に配置 (スマホ用にSticky対応＆サイズ自動調整) -->
        <section class="w-full flex flex-col items-center gap-3 border-b border-zinc-800/80 pb-5 sticky top-[53px] z-40 bg-darkBg/95 backdrop-blur-md pt-2">
            <div class="w-full flex items-center justify-between px-1">
                <div class="flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-accentRed" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                    <h2 class="text-xs sm:text-sm font-bold text-white tracking-wide">リアルタイムプレビュー</h2>
                </div>
                <button onclick="downloadImage()" class="bg-accentRed hover:bg-rose-600 active:scale-95 text-white text-xs font-bold px-3.5 py-2 rounded-lg transition shadow-lg shadow-rose-950/50 flex items-center gap-1.5 min-h-[40px]">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    保存 (PNG)
                </button>
            </div>

            <!-- BLEACH巻頭風ポエムカード本体 (プレビュー) -->
            <div class="w-full flex justify-center py-1">
                <div id="poemCard" class="poem-card-container bg-black text-white p-4 sm:p-5 transition-colors duration-300 shadow-2xl rounded-sm flex flex-col justify-between border border-zinc-800 relative select-none">
                    
                    <!-- ① 横長モノクロ画像表示枠（細め: h-14 sm:h-16、タッチ移動対応） -->
                    <div id="imageDisplayBox" class="w-full h-14 sm:h-16 bg-zinc-900 relative overflow-hidden flex items-center justify-center border border-zinc-800/50 touch-none cursor-grab active:cursor-grabbing">
                        <img id="previewImg" src="" alt="ポエム用画像" class="absolute max-w-none w-full hidden object-cover filter grayscale contrast-[1.3] pointer-events-none">
                        <div id="imgPlaceholder" class="text-zinc-600 text-[11px] text-center px-2">
                            [ 下記で画像を選択 ]
                        </div>
                    </div>

                    <!-- 縦書きポエムテキスト領域 -->
                    <div class="my-3 flex-1 flex justify-center items-start min-h-[200px] py-1">
                        <div id="previewPoem" class="writing-vertical font-serif text-base sm:text-lg tracking-[0.2em] leading-[2em] max-h-[280px] flex flex-row-reverse flex-wrap items-start whitespace-pre-wrap">
                        </div>
                    </div>

                    <!-- ② 巻数＆詩タイトル枠 -->
                    <div class="pt-1 flex justify-center items-center">
                        <div id="previewTitleBorder" class="border-[3px] border-white px-2.5 py-2 flex items-center gap-2 font-extrabold tracking-wider max-w-[260px] sm:max-w-[290px] min-h-[56px]">
                            <span id="previewVolNum" class="text-base sm:text-lg font-black leading-none shrink-0">1.</span>
                            <span id="previewVolTitle" class="text-[11px] sm:text-xs font-extrabold uppercase tracking-widest leading-tight break-words uppercase">THE DEATH AND THE STRAWBERRY</span>
                        </div>
                    </div>

                </div>
            </div>
        </section>

        <!-- 下部：デザイン・テキスト編集パネル -->
        <section class="w-full grid grid-cols-1 md:grid-cols-3 gap-4">
            
            <!-- 1. 横長画像設定 -->
            <div class="bg-cardBg/90 border border-zinc-800 rounded-xl p-4 shadow-lg space-y-3">
                <h3 class="text-xs sm:text-sm font-semibold text-zinc-300 flex items-center justify-between">
                    <span>1. 画像設定 <span class="text-[11px] text-zinc-500 font-normal">(自動モノクロ)</span></span>
                    <button id="btnOpenCrop" onclick="openCropModal()" class="text-xs bg-zinc-800 hover:bg-zinc-700 text-accentRed border border-zinc-700 px-2 py-1 rounded transition hidden">
                        ✂ トリミング編集
                    </button>
                </h3>

                <!-- アップロードエリア -->
                <div id="dropZone" onclick="document.getElementById('imageInput').click()" 
                     class="border-2 border-dashed border-zinc-700 hover:border-accentRed/70 bg-zinc-900/50 hover:bg-zinc-900 transition cursor-pointer rounded-xl p-3 text-center group flex flex-col items-center justify-center min-h-[80px]">
                    <svg class="w-5 h-5 text-zinc-500 group-hover:text-accentRed transition mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <p class="text-xs text-zinc-400 group-hover:text-zinc-200">タップして画像を選択</p>
                    <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                </div>

                <!-- スライダーコントロール群 -->
                <div class="space-y-2 pt-1">
                    <div>
                        <div class="flex justify-between text-xs text-zinc-400 mb-0.5">
                            <span>画像位置 (上下移動/ドラッグ可)</span>
                            <span id="posYVal">50%</span>
                        </div>
                        <input type="range" id="posY" min="0" max="100" value="50" class="w-full bg-zinc-700 rounded-lg appearance-none cursor-pointer" oninput="updateControls()">
                    </div>

                    <div>
                        <div class="flex justify-between text-xs text-zinc-400 mb-0.5">
                            <span>ズーム (拡大率)</span>
                            <span id="zoomVal">1.0x</span>
                        </div>
                        <input type="range" id="zoom" min="1" max="3" step="0.05" value="1" class="w-full bg-zinc-700 rounded-lg appearance-none cursor-pointer" oninput="updateControls()">
                    </div>

                    <div>
                        <div class="flex justify-between text-xs text-zinc-400 mb-0.5">
                            <span>コントラスト (白黒強弱)</span>
                            <span id="contrastVal">130%</span>
                        </div>
                        <input type="range" id="contrast" min="50" max="250" value="130" class="w-full bg-zinc-700 rounded-lg appearance-none cursor-pointer" oninput="updateControls()">
                    </div>
                </div>
            </div>

            <!-- 2. 詩 (ポエム) 本文 -->
            <div class="bg-cardBg/90 border border-zinc-800 rounded-xl p-4 shadow-lg space-y-2">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs sm:text-sm font-semibold text-zinc-300">2. 詩 (ポエム) 本文</h3>
                    <button onclick="applySamplePoem()" class="text-xs text-accentRed hover:text-rose-400 underline transition py-1 min-h-[36px]">
                        サンプル適用
                    </button>
                </div>
                <textarea id="poemInput" rows="5" placeholder="ここに詩を入力（改行で縦列が変わります）"
                    class="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-3 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-accentRed transition leading-relaxed"
                    oninput="updateControls()"></textarea>
            </div>

            <!-- 3. 巻数数字 & 詩タイトル -->
            <div class="bg-cardBg/90 border border-zinc-800 rounded-xl p-4 shadow-lg space-y-3">
                <h3 class="text-xs sm:text-sm font-semibold text-zinc-300">3. 巻数数字 & 詩タイトル</h3>
                <div class="space-y-2.5">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">巻数数字</label>
                        <input type="text" id="volNumInput" value="1." placeholder="例: 1."
                            class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2.5 text-sm text-zinc-100 focus:outline-none focus:border-accentRed min-h-[42px]"
                            oninput="updateControls()">
                    </div>
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">詩タイトル (自動折り返し)</label>
                        <input type="text" id="volTitleInput" value="THE DEATH AND THE STRAWBERRY" placeholder="例: THE DEATH AND..."
                            class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2.5 text-sm text-zinc-100 focus:outline-none focus:border-accentRed min-h-[42px]"
                            oninput="updateControls()">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 直感的画像クロップ・トリミング用モーダル (上に重ねる画面) -->
    <div id="cropModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex flex-col items-center justify-center p-4">
        <div class="bg-cardBg border border-zinc-700 rounded-2xl w-full max-w-md p-4 flex flex-col gap-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-zinc-800 pb-2">
                <h3 class="text-sm font-bold text-white flex items-center gap-2">
                    <span>✂</span> 画像トリミング・切り抜き調整
                </h3>
                <button onclick="closeCropModal()" class="text-zinc-400 hover:text-white text-lg px-2">✕</button>
            </div>
            
            <p class="text-xs text-zinc-400">枠内をドラッグ/スワイプして見せたい位置を合わせてください。</p>

            <!-- クロッププレビューエリア -->
            <div class="w-full flex justify-center py-2 bg-zinc-950 rounded-lg overflow-hidden">
                <div id="modalCropBox" class="w-[300px] h-[52px] bg-zinc-900 relative overflow-hidden border-2 border-accentRed shadow-inner cursor-grab active:cursor-grabbing touch-none">
                    <img id="modalCropImg" src="" alt="クロップ用画像" class="absolute max-w-none w-full object-cover filter grayscale contrast-[1.3] pointer-events-none">
                </div>
            </div>

            <!-- モーダル内調整スライダー -->
            <div class="space-y-3 pt-1">
                <div>
                    <div class="flex justify-between text-xs text-zinc-400 mb-1">
                        <span>上下位置移動</span>
                        <span id="modalPosVal">50%</span>
                    </div>
                    <input type="range" id="modalPosY" min="0" max="100" value="50" class="w-full" oninput="syncModalToState()">
                </div>
                <div>
                    <div class="flex justify-between text-xs text-zinc-400 mb-1">
                        <span>ズーム</span>
                        <span id="modalZoomVal">1.0x</span>
                    </div>
                    <input type="range" id="modalZoom" min="1" max="3" step="0.05" value="1" class="w-full" oninput="syncModalToState()">
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="closeCropModal()" class="flex-1 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-bold rounded-lg text-xs transition">
                    キャンセル
                </button>
                <button onclick="applyCropModal()" class="flex-1 py-2.5 bg-accentRed hover:bg-rose-600 text-white font-bold rounded-lg text-xs transition shadow-lg">
                    トリミング確定
                </button>
            </div>
        </div>
    </div>

    <!-- App Main Script -->
    <script>
        // App State
        let currentTheme = 'dark'; // 'dark' | 'light'
        let uploadedImage = null;

        // Default Sample Poem
        const defaultPoem = "僕たちは 伸ばす手に\n駆ける髪に\n背中に届く まぶしい光に\n似た何かを夢見ている";

        // DOM Elements
        const poemInput = document.getElementById('poemInput');
        const volNumInput = document.getElementById('volNumInput');
        const volTitleInput = document.getElementById('volTitleInput');
        
        const previewPoem = document.getElementById('previewPoem');
        const previewVolNum = document.getElementById('previewVolNum');
        const previewVolTitle = document.getElementById('previewVolTitle');
        const previewImg = document.getElementById('previewImg');
        const imgPlaceholder = document.getElementById('imgPlaceholder');
        const poemCard = document.getElementById('poemCard');
        const previewTitleBorder = document.getElementById('previewTitleBorder');
        const imageDisplayBox = document.getElementById('imageDisplayBox');

        // Modal Elements
        const cropModal = document.getElementById('cropModal');
        const modalCropImg = document.getElementById('modalCropImg');
        const modalCropBox = document.getElementById('modalCropBox');

        // Initialize App
        window.onload = () => {
            poemInput.value = defaultPoem;
            updateControls();
            setupTouchDrag();
            setupModalTouchDrag();
            
            // Drag and drop setup
            const dropZone = document.getElementById('dropZone');
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('border-accentRed');
            });
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('border-accentRed');
            });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('border-accentRed');
                if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                    loadImageFile(e.dataTransfer.files[0]);
                }
            });
        };

        // タッチ / マウスドラッグで画像位置（posY）を直感移動 (メイン枠)
        function setupTouchDrag() {
            let startY = 0;
            let startVal = 50;
            let isDragging = false;

            const onStart = (clientY) => {
                if (!uploadedImage) return;
                isDragging = true;
                startY = clientY;
                startVal = parseFloat(document.getElementById('posY').value);
            };

            const onMove = (clientY) => {
                if (!isDragging) return;
                const deltaY = clientY - startY;
                let newVal = startVal - (deltaY * 0.8);
                newVal = Math.max(0, Math.min(100, newVal));
                document.getElementById('posY').value = newVal;
                updateControls();
            };

            const onEnd = () => { isDragging = false; };

            imageDisplayBox.addEventListener('mousedown', (e) => onStart(e.clientY));
            window.addEventListener('mousemove', (e) => onMove(e.clientY));
            window.addEventListener('mouseup', onEnd);

            imageDisplayBox.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) onStart(e.touches[0].clientY);
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length === 1) onMove(e.touches[0].clientY);
            }, { passive: true });

            window.addEventListener('touchend', onEnd);
        }

        // モーダル枠での直感ドラッグ移動
        function setupModalTouchDrag() {
            let startY = 0;
            let startVal = 50;
            let isDragging = false;

            const onStart = (clientY) => {
                if (!uploadedImage) return;
                isDragging = true;
                startY = clientY;
                startVal = parseFloat(document.getElementById('modalPosY').value);
            };

            const onMove = (clientY) => {
                if (!isDragging) return;
                const deltaY = clientY - startY;
                let newVal = startVal - (deltaY * 0.8);
                newVal = Math.max(0, Math.min(100, newVal));
                document.getElementById('modalPosY').value = newVal;
                syncModalToState();
            };

            const onEnd = () => { isDragging = false; };

            modalCropBox.addEventListener('mousedown', (e) => onStart(e.clientY));
            window.addEventListener('mousemove', (e) => onMove(e.clientY));
            window.addEventListener('mouseup', onEnd);

            modalCropBox.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) onStart(e.touches[0].clientY);
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (isDragging && e.touches.length === 1) onMove(e.touches[0].clientY);
            }, { passive: true });

            window.addEventListener('touchend', onEnd);
        }

        // Handle Image Upload
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                loadImageFile(file);
            }
        }

        function loadImageFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadedImage = new Image();
                uploadedImage.onload = () => {
                    previewImg.src = e.target.result;
                    modalCropImg.src = e.target.result;
                    previewImg.classList.remove('hidden');
                    imgPlaceholder.classList.add('hidden');
                    document.getElementById('btnOpenCrop').classList.remove('hidden');
                    updateControls();
                    openCropModal();
                };
                uploadedImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // モーダルの開閉と同期
        function openCropModal() {
            if (!uploadedImage) return;
            document.getElementById('modalPosY').value = document.getElementById('posY').value;
            document.getElementById('modalZoom').value = document.getElementById('zoom').value;
            syncModalToState();
            cropModal.classList.remove('hidden');
        }

        function closeCropModal() {
            cropModal.classList.add('hidden');
        }

        function syncModalToState() {
            const posY = document.getElementById('modalPosY').value;
            const zoom = document.getElementById('modalZoom').value;
            const contrast = document.getElementById('contrast').value;

            document.getElementById('modalPosVal').innerText = `${Math.round(posY)}%`;
            document.getElementById('modalZoomVal').innerText = `${zoom}x`;

            modalCropImg.style.transform = `scale(${zoom})`;
            modalCropImg.style.objectPosition = `center ${posY}%`;
            modalCropImg.style.filter = `grayscale(100%) contrast(${contrast}%)`;
        }

        function applyCropModal() {
            document.getElementById('posY').value = document.getElementById('modalPosY').value;
            document.getElementById('zoom').value = document.getElementById('modalZoom').value;
            updateControls();
            closeCropModal();
        }

        // Apply Sample Poem
        function applySamplePoem() {
            poemInput.value = defaultPoem;
            volNumInput.value = "1.";
            volTitleInput.value = "THE DEATH AND THE STRAWBERRY";
            updateControls();
        }

        // Toggle Preview Theme (Dark/Light)
        function setPreviewBg(mode) {
            currentTheme = mode;
            const btnDark = document.getElementById('btnBgDark');
            const btnLight = document.getElementById('btnBgLight');

            if (mode === 'dark') {
                poemCard.style.backgroundColor = '#000000';
                poemCard.style.color = '#ffffff';
                previewTitleBorder.style.borderColor = '#ffffff';

                btnDark.className = "px-2.5 py-1.5 rounded-md text-xs font-bold transition flex items-center gap-1 bg-zinc-700 text-white shadow-sm min-h-[36px]";
                btnLight.className = "px-2.5 py-1.5 rounded-md text-xs font-bold transition flex items-center gap-1 text-zinc-400 hover:text-white min-h-[36px]";
            } else {
                poemCard.style.backgroundColor = '#ffffff';
                poemCard.style.color = '#000000';
                previewTitleBorder.style.borderColor = '#000000';

                btnLight.className = "px-2.5 py-1.5 rounded-md text-xs font-bold transition flex items-center gap-1 bg-zinc-200 text-zinc-900 font-bold shadow-sm min-h-[36px]";
                btnDark.className = "px-2.5 py-1.5 rounded-md text-xs font-bold transition flex items-center gap-1 text-zinc-400 hover:text-white min-h-[36px]";
            }
        }

        // Realtime update preview elements and image transforms
        function updateControls() {
            // Slider Values
            const posY = document.getElementById('posY').value;
            const zoom = document.getElementById('zoom').value;
            const contrast = document.getElementById('contrast').value;

            document.getElementById('posYVal').innerText = `${Math.round(posY)}%`;
            document.getElementById('zoomVal').innerText = `${zoom}x`;
            document.getElementById('contrastVal').innerText = `${contrast}%`;

            // Image Styling
            if (uploadedImage) {
                previewImg.style.transform = `scale(${zoom})`;
                previewImg.style.objectPosition = `center ${posY}%`;
                previewImg.style.filter = `grayscale(100%) contrast(${contrast}%)`;
            }

            // Text Updating
            previewPoem.innerText = poemInput.value || " ";
            previewVolNum.innerText = volNumInput.value || "";
            previewVolTitle.innerText = volTitleInput.value || "";
        }

        // html2canvasを用いてプレビュー（#poemCard）をそのままフォント一致でJPEGダウンロード保存
        async function downloadImage() {
            // Webフォント読み込み完了を待機
            await document.fonts.ready;

            const isDark = currentTheme === 'dark';
            const bgColor = isDark ? '#000000' : '#ffffff';

            html2canvas(poemCard, {
                scale: 3, // 高画質出力
                backgroundColor: bgColor,
                useCORS: true,
                logging: false,
                onclone: (clonedDoc) => {
                    const clonedCard = clonedDoc.getElementById('poemCard');
                    if (clonedCard) {
                        clonedCard.style.transform = 'none';
                        clonedCard.style.boxShadow = 'none';
                    }
                }
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `bleach_poem_${Date.now()}.jpg`;
                // JPEG形式で保存
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
            });
        }
    </script>
</body>
</html>
